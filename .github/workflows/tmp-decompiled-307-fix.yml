name: Temporary decompiled 307 patch

on:
  push:
    branches:
      - fix/miuix307-drag-freeform-followup
    paths:
      - .github/workflows/tmp-decompiled-307-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/miuix307-drag-freeform-followup
      - name: Apply exact patch
        run: python3 tools/tmp_apply_decompiled_307_fix.py
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/hellovoid/liquiddock/CaptureExclusionNames.java \
                  src/main/java/com/hellovoid/liquiddock/Miuix307DragCaptureHook.java \
                  src/main/java/com/hellovoid/liquiddock/DockLiquidGlassView.java \
                  src/main/java/com/hellovoid/liquiddock/MiuixGlassHook.java \
                  src/main/java/com/hellovoid/liquiddock/Miuix307MaterialPipeline.java
          git diff --cached --quiet && exit 1
          git commit -m "fix: align 307 drag and themed blur with decompiled launcher"
          git push origin HEAD:fix/miuix307-drag-freeform-followup

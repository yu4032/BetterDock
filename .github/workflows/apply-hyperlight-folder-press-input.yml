name: Apply folder press input fix

on:
  push:
    branches: [ feat/folder-press-glow ]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/folder-press-glow
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python ci/apply_hyperlight_folder_press_input.py
      - name: Commit production fix
        run: |
          if git diff --quiet; then
            echo "No production changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/hellovoid/liquiddock/MiuixFolderGlassHook.java
          git commit -m "fix: drive folder press glow from MotionEvent [skip ci]"
          git push origin HEAD:feat/folder-press-glow

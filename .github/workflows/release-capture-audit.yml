name: Release capture audit

on:
  push:
    branches: [ release/1.3.0 ]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Legacy capture references
        shell: bash
        run: |
          echo '=== production references ==='
          git grep -n -E 'LiveScreenCapture|DockLiquidGlassView|LiquidGlassFactory|CaptureCadence|CaptureScene(State)?|CaptureSourcePolicy|LiquidBlurBackendPolicy|LiquidBlurMode|WorkstationCaptureBurst|WorkstationWallpaperOnlyHook' -- src/main/java src/main/kotlin || true
          echo '=== direct screen/bitmap capture calls ==='
          git grep -n -E 'captureScreenAsync|HardwareBuffer|BitmapCompat|glReadPixels|copyPixels|BitmapShader' -- src/main/java src/main/kotlin || true
      - run: ./gradlew testDebugUnitTest --stacktrace
      - run: ./gradlew assembleDebug --stacktrace

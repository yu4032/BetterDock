name: Folder glass toggle patch

on:
  push:
    branches:
      - feat/folder-press-glow
    paths:
      - .github/workflows/folder-toggle-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/folder-press-glow
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply bounded folder toggle patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/main/java/com/hellovoid/liquiddock/config/ConfigSchema.java",
              '''        public static final ConfigKey<Boolean> ENABLED = bool(\n                "liquid_glass", false, false, false, ConfigKey.ExportMode.ALWAYS);\n        public static final ConfigKey<Boolean> DIMENSIONS_DP = bool(''',
              '''        public static final ConfigKey<Boolean> ENABLED = bool(\n                "liquid_glass", false, false, false, ConfigKey.ExportMode.ALWAYS);\n        public static final ConfigKey<Boolean> FOLDER_GLASS = bool(\n                "liquid_folder_glass", true, true, true, ConfigKey.ExportMode.ALWAYS);\n        public static final ConfigKey<Boolean> DIMENSIONS_DP = bool(''')
          replace_once(
              "src/main/java/com/hellovoid/liquiddock/config/ConfigSchema.java",
              "add(keys, Glass.ENABLED, Glass.DIMENSIONS_DP, Glass.BLUR_MODE, Glass.BLUR, Glass.CHROMATIC,",
              "add(keys, Glass.ENABLED, Glass.FOLDER_GLASS, Glass.DIMENSIONS_DP, Glass.BLUR_MODE, Glass.BLUR, Glass.CHROMATIC,")

          replace_once(
              "src/main/java/com/hellovoid/liquiddock/LiquidDockConfig.java",
              '''    static final class Glass {\n        final boolean enabled;\n        final boolean prismalShowNormals;''',
              '''    static final class Glass {\n        final boolean enabled, folderEnabled;\n        final boolean prismalShowNormals;''')
          replace_once(
              "src/main/java/com/hellovoid/liquiddock/LiquidDockConfig.java",
              '''            enabled = c.b(ConfigSchema.Glass.ENABLED.name(),\n                    ConfigSchema.Glass.ENABLED.runtimeFallback());\n            launcherHighlightProfile = LauncherHighlightPreferences.read(c);''',
              '''            enabled = c.b(ConfigSchema.Glass.ENABLED.name(),\n                    ConfigSchema.Glass.ENABLED.runtimeFallback());\n            folderEnabled = c.b(ConfigSchema.Glass.FOLDER_GLASS.name(),\n                    ConfigSchema.Glass.FOLDER_GLASS.runtimeFallback());\n            launcherHighlightProfile = LauncherHighlightPreferences.read(c);''')

          replace_once(
              "src/main/java/com/hellovoid/liquiddock/MiuixFolderGlassHook.java",
              '''        if (runtimeConfig == null || !runtimeConfig.enabled || !runtimeConfig.glass.enabled) {''',
              '''        if (runtimeConfig == null || !runtimeConfig.enabled || !runtimeConfig.glass.enabled\n                || !runtimeConfig.glass.folderEnabled) {''')

          replace_once(
              "src/main/kotlin/com/hellovoid/liquiddock/ComposeSettingsActivity.kt",
              '''        BooleanSetting(prefs, ConfigSchema.Glass.ENABLED, stringResource(R.string.liquid_enable), stringResource(R.string.liquid_enable_summary), masterEnabled) { liquidGlass = it }\n        ArrowPreference(''',
              '''        BooleanSetting(prefs, ConfigSchema.Glass.ENABLED, stringResource(R.string.liquid_enable), stringResource(R.string.liquid_enable_summary), masterEnabled) { liquidGlass = it }\n        BooleanSetting(prefs, ConfigSchema.Glass.FOLDER_GLASS, stringResource(R.string.liquid_folder_glass_enable), stringResource(R.string.liquid_folder_glass_enable_summary), masterEnabled && liquidGlass)\n        ArrowPreference(''')

          replace_once(
              "src/main/res/values/strings.xml",
              '''    <string name="liquid_enable_summary">Enables liquid glass on supported surfaces using the configured optical properties</string>\n''',
              '''    <string name="liquid_enable_summary">Enables liquid glass on supported surfaces using the configured optical properties</string>\n    <string name="liquid_folder_glass_enable">Enable folder glass</string>\n    <string name="liquid_folder_glass_enable_summary">Applies liquid glass to supported home-screen folders; restart launcher to apply</string>\n''')
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/folder-toggle-patch.yml
      - name: Verify tests and build
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --stacktrace
          ./gradlew assembleDebug --stacktrace
      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/java/com/hellovoid/liquiddock/config/ConfigSchema.java \
                  src/main/java/com/hellovoid/liquiddock/LiquidDockConfig.java \
                  src/main/java/com/hellovoid/liquiddock/MiuixFolderGlassHook.java \
                  src/main/kotlin/com/hellovoid/liquiddock/ComposeSettingsActivity.kt \
                  src/main/res/values/strings.xml \
                  .github/workflows/folder-toggle-patch.yml
          git commit -m "feat: add independent folder glass switch"
          git push origin HEAD:feat/folder-press-glow

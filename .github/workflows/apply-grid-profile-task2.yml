name: Apply grid profile Task 2

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feat/port-grid-10x6-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Apply Task 2 focused patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/apply_grid_profile_config.py')
          text = p.read_text()
          old = 'value == null ? key.exportDefault() : String.valueOf(value)'
          new = 'value == null ? String.valueOf(key.exportDefault()) : String.valueOf(value)'
          if text.count(old) != 1:
              raise SystemExit(f'expected one ConfigCodec generic-fix anchor, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          python3 .github/scripts/apply_grid_profile_config.py
      - name: Verify unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --stacktrace
      - name: Verify debug build
        run: ./gradlew assembleDebug --stacktrace
      - name: Commit verified implementation and remove temporary helpers
        run: |
          rm -f .github/scripts/apply_grid_profile_config.py
          rm -f .github/workflows/apply-grid-profile-task2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(grid): add selectable profile configuration"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

name: Wallpaper-only launcher glass CI

on:
  push:
    branches:
      - feat/shared-launcher-glass-session
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4

      - name: Apply shared glass through GPU atlas baseline
        run: |
          cat ci/shared-glass-patch/part-*.txt > /tmp/shared-launcher-glass.patch.gz.b64
          echo "bbf006ee8b1db614cc4d84e0dad1c7a95f70cefc2382e3c2bd2002e1c19a60e2  /tmp/shared-launcher-glass.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/shared-launcher-glass.patch.gz.b64 | gzip -d > /tmp/shared-launcher-glass.patch
          echo "f1e3b8d31196a99226d23ad9bded58612e67d83d1a0d854c06fd64ed6fadbd56  /tmp/shared-launcher-glass.patch" | sha256sum -c -
          echo '=== conflicting Compose hunk ==='
          grep -n -B12 -A50 '^@@ -474' /tmp/shared-launcher-glass.patch || grep -n -B12 -A50 'liquid_folder_glass\|liquid_widget_glass' /tmp/shared-launcher-glass.patch
          exit 86

      - name: Convert to wallpaper-only source
        run: |
          python3 ci/wallpaper_only_transform.py
          python3 ci/folder_material_refresh_transform.py
          python3 ci/folder_startup_recovery_transform.py
          git diff --check

      - name: Verify wallpaper-only contract
        run: |
          SESSION=src/main/java/com/hellovoid/liquiddock/LauncherGlassSession.java
          grep -q 'Miuix307PassBlurBridge.bind' "$SESSION"
          grep -q 'renderNormalization' "$SESSION"
          grep -q 'source=PassBlur-wallpaper-only' "$SESSION"
          if grep -nE 'HardwareRenderer|RenderNode|RecordingCanvas|root\.draw\(|requestLauncherGpuReplay|renderLauncherOverlay|launcherOesTexture|launcherSurfaceTexture' "$SESSION"; then
            echo 'Launcher scene replay still present'
            exit 1
          fi
          grep -A90 'private void syncSceneOnUiThread' "$SESSION" | grep -q 'requestFrame(false)'

      - run: chmod +x ./gradlew
      - run: ./gradlew testDebugUnitTest --stacktrace
      - run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-wallpaper-only-startup-safe-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3

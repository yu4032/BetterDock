name: Sampling safe-area writeback

on:
  push:
    branches:
      - fix/sampling-safe-area-extra

permissions:
  contents: write

jobs:
  verify-writeback:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/sampling-safe-area-extra
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Apply signed sampling safe-area refactor
        run: |
          python tools/apply_sampling_safe_area_extra.py
          git diff --check
      - run: ./gradlew testDebugUnitTest --stacktrace
      - run: ./gradlew assembleDebug --stacktrace
      - name: Commit verified implementation
        run: |
          rm -f tools/apply_sampling_safe_area_extra.py
          rm -f .github/workflows/sampling-safe-area-writeback.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix: use automatic sampling safety plus signed extras'
          git push origin HEAD:fix/sampling-safe-area-extra

name: Verify workstation mode detection fix

on:
  push:
    branches: [ agent/api101-merge-helper ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4

      - name: Checkout exact API101 baseline
        shell: bash
        run: |
          set -euo pipefail
          expected_base=ea3a444161e0693dcdd9f53e6a7ebbcee050b936
          git fetch origin api101-migration
          actual=$(git rev-parse origin/api101-migration)
          test "$actual" = "$expected_base" || { echo "api101 moved: $actual"; exit 2; }
          git checkout -B workstation-mode-fix "$expected_base"
          chmod +x ./gradlew

      - name: Inject regression contract
        shell: bash
        run: |
          cat > src/test/java/com/hellovoid/liquiddock/WorkstationModeDetectionContractTest.java <<'EOF'
          package com.hellovoid.liquiddock;

          import org.junit.Test;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import static org.junit.Assert.assertFalse;
          import static org.junit.Assert.assertTrue;

          public class WorkstationModeDetectionContractTest {
              private static String source() throws Exception {
                  return Files.readString(Path.of(
                          "src/main/java/com/hellovoid/liquiddock/MainHook.java"));
              }

              @Test public void initialLaptopModeReadIsNullSafe() throws Exception {
                  String s = source();
                  assertTrue(s.contains("private static volatile boolean workstationModeHookConfirmed;"));
                  assertTrue(s.contains("Object laptopResult = HookUtil.invokeStatic("));
                  assertTrue(s.contains("workstationMode = laptopResult instanceof Boolean && (Boolean) laptopResult;"));
                  assertFalse(s.contains("workstationMode = (Boolean) HookUtil.invokeStatic("));
              }

              @Test public void laptopModeHookMarksStateAuthoritative() throws Exception {
                  String s = source();
                  int hook = s.indexOf("HookUtil.hookMethod(sm, \"onLaptopModeChanged\"");
                  int setMode = s.indexOf("setWorkstationMode(entering);", hook);
                  int confirmed = s.indexOf("workstationModeHookConfirmed = true;", hook);
                  assertTrue(hook >= 0 && confirmed > hook && confirmed < setMode);
              }

              @Test public void startupRecheckFallsBackToDeviceConfig() throws Exception {
                  String s = source();
                  assertTrue(s.contains("new android.os.Handler(android.os.Looper.getMainLooper()).postDelayed(() ->"));
                  assertTrue(s.contains("if (workstationModeHookConfirmed) return;"));
                  assertTrue(s.contains("Object recheck = HookUtil.invokeStatic("));
                  assertTrue(s.contains("if (recheck == null)"));
                  assertTrue(s.contains("\"com.miui.home.launcher.DeviceConfig\""));
                  assertTrue(s.contains("\"isMingouLaptopPcModeEnabled\""));
                  assertTrue(s.contains("if (actual != workstationMode) setWorkstationMode(actual);"));
                  assertTrue(s.contains("}, 2000L);"));
              }
          }
          EOF

      - name: Verify RED before implementation
        shell: bash
        run: |
          set +e
          ./gradlew testDebugUnitTest --tests com.hellovoid.liquiddock.WorkstationModeDetectionContractTest --stacktrace
          status=$?
          set -e
          test "$status" -ne 0 || { echo "Expected RED but contract already passed"; exit 3; }
          echo "RED confirmed: workstation mode detection contract fails on baseline"

      - name: Apply minimal MainHook fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/main/java/com/hellovoid/liquiddock/MainHook.java')
          s = p.read_text()

          def replace_once(old, new):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, found {count}: {old!r}')
              s = s.replace(old, new, 1)

          replace_once(
              '    private static volatile boolean workstationMode;\n'
              '    private static boolean dockDragHooksInstalled;\n',
              '    private static volatile boolean workstationMode;\n'
              '    private static volatile boolean workstationModeHookConfirmed;\n'
              '    private static boolean dockDragHooksInstalled;\n')

          replace_once(
              '            workstationMode = (Boolean) HookUtil.invokeStatic(\n'
              '                    "com.miui.home.launcher.allapps.LauncherModeController", "isLaptopMode");\n',
              '            Object laptopResult = HookUtil.invokeStatic(\n'
              '                    "com.miui.home.launcher.allapps.LauncherModeController", "isLaptopMode");\n'
              '            workstationMode = laptopResult instanceof Boolean && (Boolean) laptopResult;\n')

          replace_once(
              '                    chain -> {\n'
              '                        boolean entering = (Boolean) chain.getArgs().get(0);\n'
              '                        if (entering) backupNormalHomeLayout();\n',
              '                    chain -> {\n'
              '                        boolean entering = (Boolean) chain.getArgs().get(0);\n'
              '                        workstationModeHookConfirmed = true;\n'
              '                        if (entering) backupNormalHomeLayout();\n')

          replace_once(
              '            log("[DC] workstation guard uses LauncherModeController; active=" + workstationMode);\n',
              '            log("[DC] workstation guard uses LauncherModeController; active=" + workstationMode);\n'
              '            // isLaptopMode() may still be null while Launcher is binding. Re-check after\n'
              '            // initialization unless onLaptopModeChanged already supplied authoritative state.\n'
              '            new android.os.Handler(android.os.Looper.getMainLooper()).postDelayed(() -> {\n'
              '                if (workstationModeHookConfirmed) return;\n'
              '                try {\n'
              '                    Object recheck = HookUtil.invokeStatic(\n'
              '                            "com.miui.home.launcher.allapps.LauncherModeController",\n'
              '                            "isLaptopMode");\n'
              '                    boolean actual = recheck instanceof Boolean && (Boolean) recheck;\n'
              '                    if (recheck == null) {\n'
              '                        try {\n'
              '                            Object dcResult = HookUtil.invokeStatic(\n'
              '                                    "com.miui.home.launcher.DeviceConfig",\n'
              '                                    "isMingouLaptopPcModeEnabled");\n'
              '                            actual = dcResult instanceof Boolean && (Boolean) dcResult;\n'
              '                        } catch (Throwable ignored) {}\n'
              '                    }\n'
              '                    if (actual != workstationMode) setWorkstationMode(actual);\n'
              '                } catch (Throwable ignored) {}\n'
              '            }, 2000L);\n')

          p.write_text(s)
          PY
          git diff --check

      - name: Verify GREEN contract
        run: ./gradlew testDebugUnitTest --tests com.hellovoid.liquiddock.WorkstationModeDetectionContractTest --stacktrace

      - name: Run full unit suite
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Commit only MainHook and update API101
        shell: bash
        run: |
          set -euo pipefail
          expected_base=ea3a444161e0693dcdd9f53e6a7ebbcee050b936
          rm src/test/java/com/hellovoid/liquiddock/WorkstationModeDetectionContractTest.java
          git diff --check
          changed=$(git diff --name-only)
          echo "final changed files: $changed"
          test "$changed" = "src/main/java/com/hellovoid/liquiddock/MainHook.java" || exit 4
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/hellovoid/liquiddock/MainHook.java
          git commit -m "fix: stabilize workstation mode detection"
          git fetch origin api101-migration
          actual=$(git rev-parse origin/api101-migration)
          test "$actual" = "$expected_base" || { echo "api101 moved during verification: $actual"; exit 5; }
          git push origin HEAD:api101-migration
          echo "FIX_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-workstation-mode-fix-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

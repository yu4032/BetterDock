name: Retire v1.2 S-curve

on:
  push:
    branches:
      - cleanup/remove-v12-s-curve

permissions:
  contents: write

jobs:
  retire-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-v12-s-curve
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Apply v1.2 S-curve retirement
        run: |
          python tools/remove_v12_s_curve.py
          git diff --check
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Commit verified retirement
        run: |
          rm -f tools/remove_v12_s_curve.py
          rm -f .github/workflows/retire-v12-scurve.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'cleanup: remove v1.2 S-curve refraction'
          git push origin HEAD:cleanup/remove-v12-s-curve

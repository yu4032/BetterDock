name: Apply PR22 grid spacing fix

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'feat/port-grid-10x6-v2' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/port-grid-10x6-v2
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply source patch
        run: python3 scripts/apply_pr22_grid_patch.py
      - name: Align grid contract tests
        run: python3 scripts/apply_pr22_grid_contract_tests.py
      - run: chmod +x ./gradlew
      - name: Verify unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Verify debug build
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-4-slider-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Commit verified patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/hellovoid/liquiddock/config/ConfigSchema.java \
                  src/main/java/com/hellovoid/liquiddock/LiquidDockConfig.java \
                  src/main/java/com/hellovoid/liquiddock/MainHook.java \
                  src/main/java/com/hellovoid/liquiddock/HomeGridHook.java \
                  src/main/kotlin/com/hellovoid/liquiddock/ComposeSettingsActivity.kt \
                  src/test/java/com/hellovoid/liquiddock/config/ConfigSchemaTest.java \
                  src/test/java/com/hellovoid/liquiddock/GridSpacingSemanticsContractTest.java
          git commit -m "fix: separate home grid edge offset and margin [grid-spacing-applied]"
          git push origin HEAD:feat/port-grid-10x6-v2

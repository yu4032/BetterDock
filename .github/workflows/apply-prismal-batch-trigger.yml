name: Apply Prismal batch source

on:
  push:
    branches: [ feat/main-folder-glass-rebuild ]
    paths:
      - .github/workflows/apply-prismal-batch-trigger.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/main-folder-glass-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 ci/apply_prismal_batch_once.py
      - run: git diff --check
      - run: chmod +x ./gradlew
      - run: ./gradlew :prismal:testDebugUnitTest --stacktrace
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prismal/src/main/java/com/hellovoid/prismal/PrismalRenderer.java
          git commit -m "feat: add shared-backdrop Prismal batch API [skip ci]"
          git push origin HEAD:feat/main-folder-glass-rebuild

name: Glass controls one-shot

on:
  push:
    branches: [ fix/glass-controls-s-curve ]

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/glass-controls-s-curve
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # Config schema: a dedicated opt-in legacy S-curve control, exported like the other
          # glass controls, plus enough range for Prismal's effective shadow-softness default.
          replace_once(
              'src/main/java/com/hellovoid/liquiddock/config/ConfigSchema.java',
              '''        public static final ConfigKey<Integer> LENS_REFRACTION = dp(
                  "liquid_lens_refraction", 12, 12, 12, 0, 60, ConfigKey.ExportMode.ALWAYS);
          public static final ConfigKey<Integer> CAPTURE_SCALE = integer(''',
              '''        public static final ConfigKey<Integer> LENS_REFRACTION = dp(
                  "liquid_lens_refraction", 12, 12, 12, 0, 60, ConfigKey.ExportMode.ALWAYS);
          public static final ConfigKey<Integer> LEGACY_S_CURVE = integer(
                  "liquid_legacy_s_curve", 0, 0, 0, 0, 200, ConfigKey.ExportMode.ALWAYS);
          public static final ConfigKey<Integer> CAPTURE_SCALE = integer(''')
          replace_once(
              'src/main/java/com/hellovoid/liquiddock/config/ConfigSchema.java',
              '''                Glass.IOR, Glass.NORMAL_STRENGTH, Glass.DOME, Glass.LENS_REFRACTION,
                  Glass.CAPTURE_SCALE, Glass.DYNAMIC_APP_CAPTURE, Glass.FULLSCREEN_CAPTURE,''',
              '''                Glass.IOR, Glass.NORMAL_STRENGTH, Glass.DOME, Glass.LENS_REFRACTION,
                  Glass.LEGACY_S_CURVE, Glass.CAPTURE_SCALE, Glass.DYNAMIC_APP_CAPTURE, Glass.FULLSCREEN_CAPTURE,''')
          replace_once(
              'src/main/java/com/hellovoid/liquiddock/config/ConfigSchema.java',
              '''        public static final ConfigKey<Integer> PRISMAL_SHADOW_SOFTNESS = integer(
                  "liquid_prismal_shadow_softness", 100, 100, 100, 0, 400, ConfigKey.ExportMode.ALWAYS);''',
              '''        public static final ConfigKey<Integer> PRISMAL_SHADOW_SOFTNESS = integer(
                  "liquid_prismal_shadow_softness", 100, 100, 100, 0, 2000, ConfigKey.ExportMode.ALWAYS);''')

          # Runtime config: restore the old depth-effect preference as a real optical input and
          # add the new S-curve scalar (0..2 internally).
          replace_once(
              'src/main/java/com/hellovoid/liquiddock/LiquidDockConfig.java',
              '''        final float blur, chromatic, thickness, ior, normalStrength, dome,
                  lensRefraction, highlightWidth, brightness, specularStrength, rimLight, caustics;''',
              '''        final float blur, chromatic, thickness, ior, normalStrength, dome,
                  lensRefraction, depthEffect, legacySCurveStrength, highlightWidth, brightness,
                  specularStrength, rimLight, caustics;''')
          replace_once(
              'src/main/java/com/hellovoid/liquiddock/LiquidDockConfig.java',
              '''            lensRefraction = c.f(ConfigSchema.Glass.LENS_REFRACTION.name(),
                      ConfigSchema.Glass.LENS_REFRACTION.runtimeFallback());
              highlightWidth = c.i(ConfigSchema.Glass.HIGHLIGHT_WIDTH.name(),''',
              '''            lensRefraction = c.f(ConfigSchema.Glass.LENS_REFRACTION.name(),
                      ConfigSchema.Glass.LENS_REFRACTION.runtimeFallback());
              depthEffect = c.i(ConfigSchema.Glass.DEPTH_EFFECT.name(),
                      ConfigSchema.Glass.DEPTH_EFFECT.runtimeFallback()) / 100f;
              legacySCurveStrength = c.i(ConfigSchema.Glass.LEGACY_S_CURVE.name(),
                      ConfigSchema.Glass.LEGACY_S_CURVE.runtimeFallback()) / 100f;
              highlightWidth = c.i(ConfigSchema.Glass.HIGHLIGHT_WIDTH.name(),''')

          # Keep the default preset and the GUI reset source synchronized.
          replace_once(
              'src/main/java/com/hellovoid/liquiddock/config/PresetManager.java',
              '''        values.put("liquid_depth_effect", 8);
          values.put("liquid_brightness", 108);''',
              '''        values.put("liquid_depth_effect", 8);
          values.put("liquid_legacy_s_curve", 0);
          values.put("liquid_brightness", 108);''')

          # Material adapter: expose the repaired depth control and legacy-v1.2 constants.
          m = 'src/main/java/com/hellovoid/liquiddock/Miuix307PrismalMaterial.java'
          replace_once(m,
              '''        final float lensRefractionScale;
          final float chromaticAberration;''',
              '''        final float lensRefractionScale;
          final float lensDepthEffect;
          final float legacySCurveStrength;
          final float legacyLensRefractionPx;
          final float legacyThicknessPx;
          final float chromaticAberration;''')
          replace_once(m,
              '''                float lensRefractionScale,
                  float chromaticAberration,''',
              '''                float lensRefractionScale,
                  float lensDepthEffect,
                  float legacySCurveStrength,
                  float legacyLensRefractionPx,
                  float legacyThicknessPx,
                  float chromaticAberration,''')
          replace_once(m,
              '''            this.lensRefractionScale = lensRefractionScale;
              this.chromaticAberration = chromaticAberration;''',
              '''            this.lensRefractionScale = lensRefractionScale;
              this.lensDepthEffect = lensDepthEffect;
              this.legacySCurveStrength = legacySCurveStrength;
              this.legacyLensRefractionPx = legacyLensRefractionPx;
              this.legacyThicknessPx = legacyThicknessPx;
              this.chromaticAberration = chromaticAberration;''')
          replace_once(m,
              '''                1.30f,
                  2f,
                  1f,''',
              '''                1.30f,
                  0.08f,
                  0f,
                  12f * d,
                  18f * d,
                  2f,
                  1f,''')
          replace_once(m,
              '''                glass.prismalFresnelReflect,
                  lensScale,
                  Math.max(0f, glass.chromatic),''',
              '''                glass.prismalFresnelReflect,
                  lensScale,
                  Math.max(0f, Math.min(1f, glass.depthEffect)),
                  Math.max(0f, Math.min(2f, glass.legacySCurveStrength)),
                  12f * d,
                  18f * d,
                  Math.max(0f, glass.chromatic),''')
          replace_once(m,
              '''                && nearly(g.lensRefraction, 12f)
                  && nearly(g.brightness, 1.08f)''',
              '''                && nearly(g.lensRefraction, 12f)
                  && nearly(g.depthEffect, 0.08f)
                  && nearly(g.legacySCurveStrength, 0f)
                  && nearly(g.brightness, 1.08f)''')
          replace_once(m,
              '''        float lensPx = refractionHeight * 2f * p.displacementScale * p.lensRefractionScale;
          lensPx = clamp(lensPx, 4f, Math.max(4f, minGlassDim * 0.85f));
          float lensDepth = Math.min(1f, Math.max(0f, p.normalStrength * 0.9f));''',
              '''        float lensPx = refractionHeight * 2f * p.displacementScale * p.lensRefractionScale;
          lensPx = clamp(lensPx, 4f, Math.max(4f, minGlassDim * 0.85f));''')
          replace_once(m,
              '''        uniform1f(program, "u_lensRefractionPx", lensPx);
          uniform1f(program, "u_lensDepthEffect", lensDepth);''',
              '''        uniform1f(program, "u_lensRefractionPx", lensPx);
          uniform1f(program, "u_lensDepthEffect", p.lensDepthEffect);
          uniform1f(program, "u_legacySCurveStrength", p.legacySCurveStrength);
          uniform1f(program, "u_legacyLensRefractionPx", p.legacyLensRefractionPx);
          uniform1f(program, "u_legacyThicknessPx", p.legacyThicknessPx);''')

          # Shader: make the two previously dead uniforms real, and add a switchable v1.2.0
          # geometric offset. 0 keeps current Prismal untouched; 1 selects legacy geometry;
          # values above 1 amplify legacy displacement.
          s = 'src/main/java/com/hellovoid/liquiddock/Miuix307PrismalShader.java'
          replace_once(s,
              '''            uniform float u_lensRefractionPx;
              uniform float u_lensDepthEffect;

              uniform float u_chromaticAberration;''',
              '''            uniform float u_lensRefractionPx;
              uniform float u_lensDepthEffect;
              uniform float u_legacySCurveStrength;
              uniform float u_legacyLensRefractionPx;
              uniform float u_legacyThicknessPx;

              uniform float u_chromaticAberration;''')
          replace_once(s,
              '''                float dropLens = pow(smoothstep(refractionHeight, 0.0, edgeDist), 0.82);''',
              '''                float dropLensBase = pow(smoothstep(refractionHeight, 0.0, edgeDist), 0.82);
                  float falloffPower = clamp(max(u_edgeRefractionFalloff, 0.05) * 0.205, 0.1, 4.0);
                  float dropLens = pow(max(dropLensBase, 0.0), falloffPower / 0.82);''')
          replace_once(s,
              '''                float silW = clamp(minDim * 0.12, 2.5, 34.0);''',
              '''                float silW = clamp(minDim * 0.12 * clamp(u_highlightWidth, 0.2, 3.0), 2.5, 34.0);''')
          replace_once(s,
              '''                float bandR = clamp(minDim * bandFracR * rimBandTight, mix(0.28, 0.65, 1.0 - smallGlass), min(12.0, minDim * 0.1));''',
              '''                float bandR = clamp(minDim * bandFracR * rimBandTight * clamp(u_highlightWidth, 0.2, 3.0), mix(0.28, 0.65, 1.0 - smallGlass), min(18.0, minDim * 0.16));''')
          replace_once(s,
              '''                vec2 baseOffset = lensDeltaUv + snellOff + bulgeUv;
                  float pinchMix = 1.0 - smoothstep(0.0, 0.72, tDeep);''',
              '''                vec2 currentOffset = lensDeltaUv + snellOff + bulgeUv;
                  float legacyStrength = clamp(u_legacySCurveStrength, 0.0, 2.0);
                  vec2 baseOffset = currentOffset;
                  if (legacyStrength > 0.001) {
                      // LiquidDock v1.2.0 used a Dock-height-derived SDF lens instead of the
                      // current Prismal Quick Start dimensions. Keep its optical constants local
                      // so 100% reproduces that refraction geometry without rewriting current UI
                      // parameters; lighting/color remain on the modern Prismal path.
                      float legacyRefractionHeight = clamp(u_glassSize.y * 0.48, 1.0, 140.0);
                      float legacyTw = max(legacyRefractionHeight * 1.38, 1.0);
                      legacyTw = min(legacyTw, minDim * 0.98);
                      float legacyDistMask = sdRoundBox(pPx, halfSz, crMask, 0.0);
                      float legacyEdgeDist = -legacyDistMask;
                      float legacyHSig = getHeightFromDist(legacyDistMask, legacyTw);
                      vec2 legacyGradHSig = computeGradientHeight(pPx, halfSz, crMask, 0.0, legacyTw);

                      float legacyInnerReach = max(min(halfSz.x, halfSz.y) - crMask * 0.42, minDim * 0.22);
                      legacyInnerReach += legacyRefractionHeight * 1.25;
                      legacyInnerReach = min(legacyInnerReach, max(halfSz.x, halfSz.y) * 0.95);
                      float legacyTDeep = clamp(legacyEdgeDist / max(legacyInnerReach, 2.0), 0.0, 1.0);
                      float legacyTShell = 1.0 - legacyTDeep;
                      float legacyMeniscusBand = smoothstep(0.0, 0.12, legacyTShell);
                      float legacyHCap = pow(legacyTShell, 0.38);
                      float legacyEdgeBulge = 0.10 * pow(legacyTShell, 2.8);
                      float legacyHDome = (legacyHCap + legacyEdgeBulge) * legacyMeniscusBand;
                      float legacyCoreBlend = smoothstep(0.0, 0.38, legacyTDeep);
                      float legacyHSlab = mix(legacyHSig * (0.58 + 0.42 * legacyCoreBlend), legacyHSig, 0.4);
                      float legacyDomeW = 0.74 + 0.26 * smoothstep(0.12, 0.94, legacyTShell);
                      float legacyHeight = mix(legacyHSlab, legacyHDome, legacyDomeW);
                      float legacyEdgeRound = 1.0 - smoothstep(0.72, 1.0, legacyTShell);
                      legacyHeight = clamp(legacyHeight * (0.84 + 0.16 * legacyMeniscusBand + 0.08 * legacyEdgeRound), 0.0, 1.0);

                      float legacyShellCurv = smoothstep(0.0, 1.0, legacyTShell);
                      vec2 legacyGCap = outward * (-legacyShellCurv * (0.38 / max(minDim, 8.0)));
                      legacyGCap *= legacyMeniscusBand * legacyEdgeRound;
                      vec2 legacyGradH = mix(legacyGradHSig, legacyGCap, legacyDomeW);
                      vec3 legacyN = normalize(vec3(-legacyGradH.x * 1.15, -legacyGradH.y * 1.15, 1.0));

                      float legacyCosVN = clamp(dot(legacyN, V), 0.0, 1.0);
                      float legacyR0 = pow((1.0 - 1.55) / (1.0 + 1.55), 2.0);
                      float legacySilW = clamp(minDim * 0.12, 1.0, 90.0);
                      float legacyEdgeSil = smoothstep(legacySilW, 0.0, legacyEdgeDist) * smoothstep(-4.5, 0.0, legacyDistMask);
                      float legacyTiltW = clamp(length(legacyN.xy) * 2.4, 0.0, 1.0);
                      float legacyGrazingW = clamp(legacyEdgeSil * 0.94 + legacyTiltW * 0.55, 0.0, 1.0);
                      float legacyCosVNeff = mix(legacyCosVN, max(0.04, legacyCosVN * 0.22 + 0.07 * legacyTiltW), legacyGrazingW);
                      float legacyF = legacyR0 + (1.0 - legacyR0) * pow(1.0 - legacyCosVNeff, 5.0);

                      vec2 legacyLensDir = gradLens + 0.08 * normalize(cenSafe);
                      float legacyLensLen = length(legacyLensDir);
                      legacyLensDir = legacyLensLen > 1e-5 ? legacyLensDir / legacyLensLen : vec2(0.0);
                      float legacySdIn = min(sdKy, 0.0);
                      float legacyDLens = 0.0;
                      if ((-sdKy) < legacyRefractionHeight) {
                          legacyDLens = circleMapRealistic(1.0 - (-legacySdIn / legacyRefractionHeight)) * (-u_legacyLensRefractionPx);
                      }
                      vec2 legacyLensDeltaUv = (legacyDLens * legacyLensDir) / u_resolution;
                      float legacyParallaxK = 0.052 * 1.15;
                      vec2 legacyParallax = (gradLens * legacyHeight * (7.0 + 22.0 * legacyF)) / u_resolution * legacyParallaxK;
                      legacyLensDeltaUv += legacyParallax;
                      legacyLensDeltaUv *= mix(0.78, 1.12, (1.0 - legacyF) * (0.42 + 0.58 * legacyHeight));

                      float legacyRefrStr = legacyHeight * (0.5 + legacyF * 0.35);
                      vec3 legacyRefIn = refract(-V, legacyN, 1.0 / 1.55);
                      vec3 legacyRefOut = (dot(legacyRefIn, legacyRefIn) < 0.001) ? vec3(0.0) : refract(legacyRefIn, -legacyN, 1.55);
                      vec2 legacySnellOff = (legacyRefOut.xy * u_legacyThicknessPx * legacyRefrStr / u_resolution) * 1.15;
                      legacySnellOff *= mix(0.72, 1.18, (1.0 - legacyF) * (0.5 + 0.5 * legacyHeight));

                      vec2 legacyBDir = length(pPx) > 1e-3 ? -normalize(pPx) : vec2(0.0, -1.0);
                      float legacyBulge = smoothstep(0.05, 0.38, legacyTDeep) * (1.0 - smoothstep(0.52, 0.94, legacyTDeep));
                      legacyBulge = pow(max(legacyBulge, 0.0), 0.62) * legacyHeight * 0.024;
                      legacyBulge *= smoothstep(0.02, 0.36, legacyTDeep);
                      vec2 legacyBulgeUv = legacyBDir * legacyBulge * u_glassSize / u_resolution;

                      vec2 legacyOffset = legacyLensDeltaUv + legacySnellOff + legacyBulgeUv;
                      baseOffset = legacyStrength <= 1.0
                              ? mix(currentOffset, legacyOffset, legacyStrength)
                              : legacyOffset * legacyStrength;
                  }
                  float pinchMix = 1.0 - smoothstep(0.0, 0.72, tDeep);''')

          # Compose GUI: current zero-copy semantics, current preset reset values, decimal storage
          # independent from the displayed unit, repaired controls, and explicit restart semantics.
          u = 'src/main/kotlin/com/hellovoid/liquiddock/ComposeSettingsActivity.kt'
          replace_once(u,
              '''    val default: Int get() = config.uiDefault()
              val min: Int get() = requireNotNull(config.minInt())
              val max: Int get() = requireNotNull(config.maxInt())
          }''',
              '''    val default: Int get() = config.uiDefault()
              val min: Int get() = requireNotNull(config.minInt())
              val max: Int get() = requireNotNull(config.maxInt())
              val isDecimal: Boolean get() = config.storageMode() == ConfigKey.StorageMode.DP_TENTHS
              fun resetValue(): Float {
                  if (!key.startsWith("liquid_")) return default.toFloat()
                  val preset = PresetManager.defaultValues()
                  val raw = if (isDecimal) preset["${key}_tenths"] else preset[key]
                  return if (raw is Number) raw.toFloat() / if (isDecimal) 10f else 1f else default.toFloat()
              }
          }''')
          replacements = {
              '"liquid_lens_refraction" -> "兼容旧配置：作为 Prismal 边缘透镜距离倍率"': '"liquid_lens_refraction" -> "Prismal 边缘透镜位移倍率；迁移后的常用值约 1.3×，过高会快速达到短边位移上限"',
              '"liquid_highlight_width" -> "兼容控制 Prismal 边缘高光带宽"': '"liquid_highlight_width" -> "同时调整 Fresnel 轮廓与边缘高光带宽"',
              '"liquid_depth_effect" -> "兼容控制 Prismal lens-depth 倍率"': '"liquid_depth_effect" -> "控制透镜方向向中心偏转的混合强度；数值越高越偏向径向折射"',
              '"liquid_prismal_refraction_inset" -> "Prismal 折射遮罩向内收缩的距离"': '"liquid_prismal_refraction_inset" -> "控制玻璃可见遮罩的内缩尺度；不直接增加折射位移"',
              '"liquid_prismal_edge_refraction_falloff" -> "边缘折射向内部衰减的曲线强度"': '"liquid_prismal_edge_refraction_falloff" -> "控制边缘折射向内部的衰减；越高越集中在边缘"',
              '"liquid_capture_power_limit_fps" -> "动画和动态应用实时捕获的统一帧率上限"': '"liquid_capture_power_limit_fps" -> "旧版 Bitmap 捕获帧率；当前 zero-copy 后端不使用"',
              '"liquid_capture_scale" -> "SurfaceFlinger 捕获分辨率；越低越省电"': '"liquid_capture_scale" -> "旧版 SurfaceFlinger 读回缩放；当前 zero-copy 后端不使用"',
              '"liquid_capture_stop_delay" -> "Dock 隐藏后继续允许捕获的缓冲时间"': '"liquid_capture_stop_delay" -> "旧版屏幕捕获停止延迟；当前 zero-copy 后端不使用"',
              '"liquid_dynamic_app_probe_fps" -> "静态应用中检测画面变化的低频帧率"': '"liquid_dynamic_app_probe_fps" -> "旧版动态捕获探测帧率；当前 zero-copy 后端不使用"',
              '"liquid_dynamic_motion_threshold" -> "越低越容易因亮度变化进入高频捕获"': '"liquid_dynamic_motion_threshold" -> "旧版动态捕获阈值；当前 zero-copy 后端不使用"',
              '"liquid_dynamic_bit_threshold" -> "越低越容易因采样像素变化触发高频捕获"': '"liquid_dynamic_bit_threshold" -> "旧版动态捕获像素阈值；当前 zero-copy 后端不使用"',
              '"liquid_dynamic_hold_ms" -> "检测到动态后维持高频捕获的时长"': '"liquid_dynamic_hold_ms" -> "旧版动态捕获保持时间；当前 zero-copy 后端不使用"',
              '"liquid_black_threshold" -> "低于此平均亮度的捕获帧会被丢弃"': '"liquid_black_threshold" -> "旧版黑帧过滤阈值；当前 zero-copy 后端不使用"',
          }
          for old, new in replacements.items():
              replace_once(u, old, new)
          replace_once(u,
              '''    "liquid_lens_refraction" -> "Prismal 边缘透镜位移倍率；迁移后的常用值约 1.3×，过高会快速达到短边位移上限"
              "liquid_chromatic" -> "Prismal 色散总强度"''',
              '''    "liquid_lens_refraction" -> "Prismal 边缘透镜位移倍率；迁移后的常用值约 1.3×，过高会快速达到短边位移上限"
              "liquid_legacy_s_curve" -> "旧版整片 SDF 折射几何：0=关闭，100=复现 v1.2.0，200=双倍"
              "liquid_chromatic" -> "Prismal 色散总强度"''')
          replace_once(u,
              '''    IntSpec(ConfigSchema.Glass.DOME, "穹顶凸起", "%"),
              IntSpec(ConfigSchema.Glass.LENS_REFRACTION, "透镜折射"),
              IntSpec(ConfigSchema.Glass.CHROMATIC, "色散强度", ""),''',
              '''    IntSpec(ConfigSchema.Glass.DOME, "穹顶凸起", "%"),
              IntSpec(ConfigSchema.Glass.LENS_REFRACTION, "透镜折射倍率", "×"),
              IntSpec(ConfigSchema.Glass.LEGACY_S_CURVE, "v1.2 S形折射", "%"),
              IntSpec(ConfigSchema.Glass.DEPTH_EFFECT, "透镜中心偏转", "%"),
              IntSpec(ConfigSchema.Glass.CHROMATIC, "色散强度", ""),''')
          replace_once(u,
              '''    IntSpec(ConfigSchema.Glass.PRISMAL_REFRACTION_INSET, "Prismal · 折射内缩"),''',
              '''    IntSpec(ConfigSchema.Glass.PRISMAL_REFRACTION_INSET, "Prismal · 折射内缩", "px"),''')
          replace_once(u,
              '''    IntSpec(ConfigSchema.Glass.PRISMAL_SMIN_SMOOTHING, "Prismal · SDF 平滑"),''',
              '''    IntSpec(ConfigSchema.Glass.PRISMAL_SMIN_SMOOTHING, "Prismal · SDF 平滑", "px"),''')
          replace_once(u,
              '''    SettingsList(padding, stringResource(R.string.page_liquid)) {
                  BooleanSetting(prefs, ConfigSchema.Glass.ENABLED,''',
              '''    SettingsList(
                  padding,
                  stringResource(R.string.page_liquid),
                  "当前使用 PassBlur → OES → Prismal zero-copy；修改光学参数后点击右上角“重启桌面”生效。",
              ) {
                  BooleanSetting(prefs, ConfigSchema.Glass.ENABLED,''')
          replace_once(u,
              '''private fun SettingsList(padding: PaddingValues, title: String, content: @Composable ColumnScope.() -> Unit) {
              LazyColumn(modifier = Modifier.fillMaxSize(), contentPadding = padding) {
                  item { PageHeader(title) }''',
              '''private fun SettingsList(
              padding: PaddingValues,
              title: String,
              summary: String? = null,
              content: @Composable ColumnScope.() -> Unit,
          ) {
              LazyColumn(modifier = Modifier.fillMaxSize(), contentPadding = padding) {
                  item { PageHeader(title, summary) }''')
          replace_once(u,
              '''private fun IntSetting(prefs: SharedPreferences, spec: IntSpec, enabledOverride: Boolean? = null) {
              val decimalDp = spec.unit == "dp"
              val initial = if (decimalDp && prefs.contains("${spec.key}_tenths"))
                  prefs.getInt("${spec.key}_tenths", spec.default * 10) / 10f
              else prefs.getInt(spec.key, spec.default).toFloat()
              var value by remember(spec.key) { mutableStateOf(initial) }''',
              '''private fun IntSetting(prefs: SharedPreferences, spec: IntSpec, enabledOverride: Boolean? = null) {
              val decimalDp = spec.isDecimal
              val resetValue = spec.resetValue()
              val initial = if (decimalDp && prefs.contains("${spec.key}_tenths"))
                  prefs.getInt("${spec.key}_tenths", (resetValue * 10f).roundToInt()) / 10f
              else prefs.getInt(spec.key, resetValue.roundToInt()).toFloat()
              var value by remember(spec.key) { mutableStateOf(initial) }''')
          replace_once(u,
              '''                onClick = { save(spec.default.toFloat()) },
                  enabled = enabled && value != spec.default.toFloat(),''',
              '''                onClick = { save(resetValue) },
                  enabled = enabled && kotlin.math.abs(value - resetValue) > 0.0001f,''')

          print('glass controls implementation patched')
          PY

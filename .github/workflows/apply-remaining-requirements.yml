name: Apply remaining approved requirements

on:
  push:
    branches: [ feat/main-folder-glass-rebuild ]
    paths:
      - '.github/workflows/apply-remaining-requirements.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/main-folder-glass-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Correct staged UI anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ci/apply_remaining_ui.py')
          t = p.read_text()
          old = '"调试：用 RGB 直接显示当前表面法线"'
          new = '"调试：用 RGB 直接显示当前 Prismal 表面法线"'
          if t.count(old) < 1:
              raise SystemExit('staged UI anchor not found')
          p.write_text(t.replace(old, new, 1))
          PY
      - name: Apply runtime and settings transforms
        run: |
          python ci/apply_remaining_runtime.py
          python ci/apply_remaining_ui.py
      - name: Verify remaining requirements
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Commit verified production changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            prismal/src/main/java/com/hellovoid/prismal/PrismalRenderer.java \
            src/main/java/com/hellovoid/liquiddock/LiquidDockConfig.java \
            src/main/java/com/hellovoid/liquiddock/LauncherGlassSession.java \
            src/main/kotlin/com/hellovoid/liquiddock/ComposeSettingsActivity.kt \
            src/main/res/values/strings.xml \
            src/main/res/values-zh-rCN/strings.xml
          git diff --cached --check
          git diff --cached --quiet && { echo 'No production changes'; exit 1; }
          git commit -m 'feat: complete Launcher glass controls and settings cleanup'
          git push origin HEAD:feat/main-folder-glass-rebuild

# Trigger after workflow registration on the branch.

name: Apply chromatic default 2

on:
  push:
    branches: [ fix/chromatic-default-preset-2 ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chromatic-default-preset-2
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply minimal chromatic-default change
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "src/main/java/com/hellovoid/liquiddock/config/ConfigSchema.java": [
                  ('"liquid_chromatic", 8, 8, 8, 0, 40', '"liquid_chromatic", 2, 2, 2, 0, 40'),
              ],
              "src/main/java/com/hellovoid/liquiddock/config/PresetManager.java": [
                  ('values.put("liquid_chromatic", 26);', 'values.put("liquid_chromatic", 2);'),
                  ('// Effective official Prismal Quick Start optics: PrismalFrameLayout construction followed\n        // by PrismalLiquidGlass.applyBase(). Keep this preset synchronized with the zero-copy\n        // material defaults so applying the preset cannot silently return to the older V2 look.',
                   '// Prismal Quick Start optics with LiquidDock\'s intentional chromatic-strength override.\n        // Keep this preset synchronized with the zero-copy material defaults.'),
              ],
              "src/main/java/com/hellovoid/liquiddock/config/ConfigMigration.java": [
                  ('migrateIntDefault(sp, e, "liquid_chromatic", 0, 26);',
                   'migrateIntDefault(sp, e, "liquid_chromatic", 0, 2);'),
              ],
              "src/main/java/com/hellovoid/liquiddock/Miuix307PrismalMaterial.java": [
                  ('                1.30f,\n                26f,\n                1f,',
                   '                1.30f,\n                2f,\n                1f,'),
                  ('&& nearly(g.chromatic, 8f)',
                   '&& (nearly(g.chromatic, 8f) || nearly(g.chromatic, 2f))'),
                  (' * Effective official Prismal Quick Start state: PrismalFrameLayout constructor defaults\n     * followed by PrismalLiquidGlass.applyBase(). applyBase intentionally leaves blur, chromatic,\n     * liquid-dome, Fresnel, and lens-scale at the FrameLayout values, so renderer field\n     * initializers are not the final public material recipe.',
                   ' * Prismal Quick Start state adapted for LiquidDock. Geometry and lighting retain the\n     * effective PrismalFrameLayout + applyBase() values, while chromatic strength intentionally\n     * defaults to 2 for LiquidDock.'),
              ],
              "src/test/java/com/hellovoid/liquiddock/config/ConfigSchemaTest.java": [
                  ('assertComposeIntSpec(ConfigSchema.Glass.CHROMATIC, 8, 0, 40);',
                   'assertComposeIntSpec(ConfigSchema.Glass.CHROMATIC, 2, 0, 40);'),
              ],
              "src/test/java/com/hellovoid/liquiddock/config/ConfigPresetTest.java": [
                  ('expected.put("liquid_chromatic", 26);', 'expected.put("liquid_chromatic", 2);'),
              ],
              "src/test/java/com/hellovoid/liquiddock/PrismalOfficialParityV3Test.java": [
                  ('/** Locks LiquidDock to PrismalFrameLayout + PrismalLiquidGlass.applyBase() effective values. */',
                   '/** Locks Prismal parity except for LiquidDock\'s intentional chromatic-strength override. */'),
                  ('assertEquals(26f, p.chromaticAberration, EPS);',
                   'assertEquals(2f, p.chromaticAberration, EPS);'),
                  ('assertEquals(26, p.get("liquid_chromatic"));',
                   'assertEquals(2, p.get("liquid_chromatic"));'),
                  ('assertTrue(migration.contains("\\\"liquid_chromatic\\\", 0, 26"));',
                   'assertTrue(migration.contains("\\\"liquid_chromatic\\\", 0, 2"));'),
              ],
              "src/test/java/com/hellovoid/liquiddock/Miuix307PrismalParityRepairTest.java": [
                  ('assertEquals(4f, p.edgeRefractionFalloff, EPS);',
                   'assertEquals(4f, p.edgeRefractionFalloff, EPS);\n        assertEquals(2f, p.chromaticAberration, EPS);'),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{filename}: expected exactly one occurrence, found {count}: {old!r}")
                  text = text.replace(old, new)
              path.write_text(text)

          Path('.github/workflows/apply-chromatic-default-2.yml').unlink()
      - run: chmod +x ./gradlew
      - run: ./gradlew testDebugUnitTest --stacktrace
      - run: ./gradlew assembleDebug --stacktrace
      - name: Commit verified change
        shell: bash
        run: |
          git config user.name 'yu4032'
          git config user.email '4032542465@smail.lnu.edu.cn'
          git add -A
          git commit -m 'fix: set chromatic defaults to 2'
          git push origin HEAD:fix/chromatic-default-preset-2

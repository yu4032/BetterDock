name: MiuiX307 one-shot Dock source patch

on:
  push:
    branches:
      - demo/miuix307-material-pipeline

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'chore: narrow one-shot Dock source patch' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/miuix307-drag-freeform-followup
          fetch-depth: 0
      - name: Patch APP freeform source selection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/com/hellovoid/liquiddock/DockLiquidGlassView.java')
          s = p.read_text()
          old1 = ("        final boolean liveHomeBehindFreeform = useFullscreen\n"
                  "                && !workstationMode\n"
                  "                && requestScene == CaptureScene.HOME\n"
                  "                && freeformLayerResolver.hasVisibleFreeformTasks();\n")
          new1 = ("        final boolean visibleFreeform = useFullscreen\n"
                  "                && !workstationMode\n"
                  "                && freeformLayerResolver.hasVisibleFreeformTasks();\n"
                  "        final boolean liveHomeBehindFreeform = visibleFreeform\n"
                  "                && requestScene == CaptureScene.HOME;\n")
          old2 = ("        } else if (workstationMode) {\n"
                  "            selectedSource = CaptureSourcePolicy.sourceForWorkstationScene(\n"
                  "                    requestScene, localCaptureSurface != null);\n"
                  "        } else {\n"
                  "            selectedSource = CaptureSourcePolicy.sourceFor(\n")
          new2 = ("        } else if (workstationMode) {\n"
                  "            selectedSource = CaptureSourcePolicy.sourceForWorkstationScene(\n"
                  "                    requestScene, localCaptureSurface != null);\n"
                  "        } else if (requestScene == CaptureScene.APP && visibleFreeform) {\n"
                  "            // A visible freeform task is wallpaper-owned for the floating Dock. Decide this\n"
                  "            // before mode-1 submission so the app/freeform composition is never sampled even\n"
                  "            // for the short interval before the final FreeformCaptureLeashHook race guard.\n"
                  "            selectedSource = CaptureSourcePolicy.Source.WALLPAPER;\n"
                  "        } else {\n"
                  "            selectedSource = CaptureSourcePolicy.sourceFor(\n")
          if s.count(old1) != 1 or s.count(old2) != 1:
              raise SystemExit(f'exact Dock anchors not unique: first={s.count(old1)} second={s.count(old2)}')
          s = s.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- src/main/java/com/hellovoid/liquiddock/DockLiquidGlassView.java
      - name: Commit exact patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/java/com/hellovoid/liquiddock/DockLiquidGlassView.java
          git commit -m 'fix: select wallpaper before freeform capture'
          git push origin HEAD:fix/miuix307-drag-freeform-followup

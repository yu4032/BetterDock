name: Temporary themed visual and drag patch

on:
  push:
    branches:
      - fix/miuix307-drag-freeform-followup
    paths:
      - .github/workflows/tmp-theme-drag-visual-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/miuix307-drag-freeform-followup
      - name: Apply exact patch
        run: python3 tools/tmp_apply_theme_drag_visual_fix.py
      - name: Verify patch scope
        run: |
          git diff --check
          git diff --name-only
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/hellovoid/liquiddock/MiuixGlassHook.java \
                  src/main/java/com/hellovoid/liquiddock/DockLiquidGlassView.java
          git diff --cached --quiet && exit 1
          git commit -m "fix: preserve themed visual owner and freeze unexcluded drag"
          git push origin HEAD:fix/miuix307-drag-freeform-followup

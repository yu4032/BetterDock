name: Decompile official Prismal v1.0.1

on:
  push:
    branches:
      - refactor/prismal-official-model
  workflow_dispatch:

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official JitPack AAR
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o /tmp/Prismal-v1.0.1.aar \
            https://jitpack.io/com/github/styropyr0/Prismal/v1.0.1/Prismal-v1.0.1.aar
          unzip -p /tmp/Prismal-v1.0.1.aar classes.jar > /tmp/prismal-classes.jar
          sha256sum /tmp/Prismal-v1.0.1.aar /tmp/prismal-classes.jar
      - name: Disassemble official renderer bytecode
        run: |
          set -euxo pipefail
          javap -classpath /tmp/prismal-classes.jar -c -p \
            com.matrix.prismal.renderer.PrismalGlassRenderer \
            > /tmp/PrismalGlassRenderer.javap.txt
          grep -n -A18 -B18 -E 'uEdgeRefractionFalloff|uHighlightWidth|glGetUniformLocation|glUniform1f' \
            /tmp/PrismalGlassRenderer.javap.txt \
            > /tmp/PrismalGlassRenderer.uniforms.txt || true
          cat /tmp/PrismalGlassRenderer.uniforms.txt
      - uses: actions/upload-artifact@v4
        with:
          name: official-prismal-v1.0.1-decompile
          path: |
            /tmp/PrismalGlassRenderer.javap.txt
            /tmp/PrismalGlassRenderer.uniforms.txt
          if-no-files-found: error
          retention-days: 3

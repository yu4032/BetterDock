name: Folder glass reference extract

on:
  pull_request:
    branches: [ main ]

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e6c55c8fda2153ecf2269d0b1ea0db44eee67ce8
          path: old

      - name: Materialize old folder wallpaper-only reference
        working-directory: old
        run: |
          cat ci/shared-glass-patch/part-*.txt > /tmp/shared-launcher-glass.patch.gz.b64
          echo "bbf006ee8b1db614cc4d84e0dad1c7a95f70cefc2382e3c2bd2002e1c19a60e2  /tmp/shared-launcher-glass.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/shared-launcher-glass.patch.gz.b64 | gzip -d > /tmp/shared-launcher-glass.patch
          echo "f1e3b8d31196a99226d23ad9bded58612e67d83d1a0d854c06fd64ed6fadbd56  /tmp/shared-launcher-glass.patch" | sha256sum -c -
          COMPOSE=src/main/kotlin/com/hellovoid/liquiddock/ComposeSettingsActivity.kt
          git apply --check --exclude="$COMPOSE" /tmp/shared-launcher-glass.patch
          git apply --exclude="$COMPOSE" /tmp/shared-launcher-glass.patch
          python3 ci/shared_glass_compose_ui_transform.py
          git apply --check ci/shared-glass-config-test.patch
          git apply ci/shared-glass-config-test.patch
          python3 ci/shared_glass_localization_contract_transform.py

          cat ci/shared-glass-inroot-v2/part-*.txt > /tmp/shared-glass-inroot.patch.gz.b64
          echo "fd3178441abda2c3e2d9c57c08f9225c4600c867ad7a9c8e30fb81379e7fabb9  /tmp/shared-glass-inroot.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/shared-glass-inroot.patch.gz.b64 | gzip -d > /tmp/shared-glass-inroot.patch
          echo "8e736befc09e8f0d288f2a4a8fb36f13f91062d7c4f58f4f947fc00075fb368f  /tmp/shared-glass-inroot.patch" | sha256sum -c -
          git apply --check /tmp/shared-glass-inroot.patch
          git apply /tmp/shared-glass-inroot.patch

          cat ci/shared-glass-lifecycle-v1/part-*.txt > /tmp/shared-glass-lifecycle.patch.gz.b64
          echo "2cc27b1c2784be21194ea7ba3517529e904dadfb6257e353d042c2b798410af3  /tmp/shared-glass-lifecycle.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/shared-glass-lifecycle.patch.gz.b64 | gzip -d > /tmp/shared-glass-lifecycle.patch
          echo "68571f616dea79ef9c99940518219ded46293541a9054261e6f4dba7b9cda63f  /tmp/shared-glass-lifecycle.patch" | sha256sum -c -
          git apply --check /tmp/shared-glass-lifecycle.patch
          git apply /tmp/shared-glass-lifecycle.patch

          cat ci/shared-glass-gpu-atlas-v1/part-*.txt > /tmp/shared-glass-gpu-atlas.patch.gz.b64
          echo "6e855caac8b07b3025044ce02a86de6fc2e08056406ef947c8335f2cf9483681  /tmp/shared-glass-gpu-atlas.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/shared-glass-gpu-atlas.patch.gz.b64 | gzip -d > /tmp/shared-glass-gpu-atlas.patch
          echo "07d9fba07c88083a8b1a648ebf24436be380acfd64b7899fd640145af6489473  /tmp/shared-glass-gpu-atlas.patch" | sha256sum -c -
          git apply --check /tmp/shared-glass-gpu-atlas.patch
          git apply /tmp/shared-glass-gpu-atlas.patch
          git apply --check ci/shared-glass-gpu-atlas-contract-fix.patch
          git apply ci/shared-glass-gpu-atlas-contract-fix.patch

          python3 ci/wallpaper_only_transform.py
          python3 ci/folder_material_refresh_transform.py
          python3 ci/folder_startup_recovery_transform.py

          mkdir -p /tmp/folder-reference
          cp src/main/java/com/hellovoid/liquiddock/LauncherGlass*.java /tmp/folder-reference/
          cp src/main/java/com/hellovoid/liquiddock/MiuixFolderGlassHook.java /tmp/folder-reference/

      - uses: actions/upload-artifact@v4
        with:
          name: folder-glass-reference-sources
          path: /tmp/folder-reference/*.java
          if-no-files-found: error
          retention-days: 1

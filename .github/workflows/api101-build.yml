name: API101 migration build

on:
  push:
    branches:
      - main
      - api101-migration
      - refactor/modular-architecture
      - 'fix/**'
      - 'feat/**'
      - 'demo/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout feature branch for verified writeback
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/sampling-safe-area-extra'
        run: git checkout fix/sampling-safe-area-extra
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Apply signed sampling safe-area refactor
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/sampling-safe-area-extra'
        run: |
          python tools/apply_sampling_safe_area_extra.py
          git diff --check
      - run: ./gradlew testDebugUnitTest --stacktrace
      - run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-api101-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Commit verified implementation and restore standard CI
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/sampling-safe-area-extra'
        run: |
          git show origin/main:.github/workflows/api101-build.yml > .github/workflows/api101-build.yml
          rm -f .github/workflows/sampling-safe-area-writeback.yml
          rm -f tools/apply_sampling_safe_area_extra.py
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix: use automatic sampling safety plus signed extras'
          git push origin HEAD:fix/sampling-safe-area-extra

name: API101 migration build

on:
  push:
    branches:
      - main
      - api101-migration
      - refactor/modular-architecture
      - 'fix/**'
      - 'feat/**'
      - 'demo/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - run: ./gradlew testDebugUnitTest --stacktrace
      - run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-api101-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Pack temporary source snapshot
        if: always()
        run: |
          tar -czf /tmp/liquiddock-source.tar.gz \
            --exclude=.git \
            --exclude=build \
            --exclude=prismal/build \
            .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liquiddock-source-snapshot
          path: /tmp/liquiddock-source.tar.gz
          retention-days: 1
      # Keep the same Gradle verification gates on main and active API101 development branches.

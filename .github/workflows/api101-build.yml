name: API101 migration build

on:
  push:
    branches:
      - main
      - api101-migration
      - refactor/modular-architecture
      - refactor/prismal-official-model
      - 'fix/**'
      - 'feat/**'
      - 'demo/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Apply standalone Prismal integration
        run: |
          python tools/fix_prismal_patch_script.py
          python tools/apply_prismal_module_refactor.py
          git diff --check
      - run: ./gradlew testDebugUnitTest --stacktrace
      - run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-prismal-module-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Commit verified Prismal integration
        if: github.event_name == 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/api101-build.yml > .github/workflows/api101-build.yml
          rm -f tools/apply_prismal_module_refactor.py tools/fix_prismal_patch_script.py
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No verified production changes to commit'
          else
            git commit -m 'refactor: route PassBlur through standalone Prismal module'
            git push origin HEAD:refactor/prismal-official-model
          fi

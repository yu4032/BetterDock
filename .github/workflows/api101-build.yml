name: API101 migration build

on:
  push:
    branches:
      - main
      - api101-migration
      - refactor/modular-architecture
      - 'fix/**'
      - 'feat/**'
      - 'demo/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Apply atomic Prismal mapping snapshot
        run: |
          if [ -f tools/apply_prismal_mapping_snapshot_fix.py ]; then
            python tools/apply_prismal_mapping_snapshot_fix.py
          fi
          if [ -f tools/migrate_prismal_mapping_snapshot_contracts.py ]; then
            python tools/migrate_prismal_mapping_snapshot_contracts.py
          fi
          if [ -f tools/fix_prismal_mapping_snapshot_contract_compile.py ]; then
            python tools/fix_prismal_mapping_snapshot_contract_compile.py
          fi
          git diff --check
      - run: ./gradlew testDebugUnitTest --stacktrace
      - run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-prismal-mapping-snapshot-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3
      - name: Commit verified production mapping snapshot
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          if [ ! -f tools/apply_prismal_mapping_snapshot_fix.py ]; then
            exit 0
          fi
          rm -f tools/apply_prismal_mapping_snapshot_fix.py
          rm -f tools/migrate_prismal_mapping_snapshot_contracts.py
          rm -f tools/fix_prismal_mapping_snapshot_contract_compile.py
          rm -f .github/workflows/prismal-mapping-snapshot-fix.yml
          git show origin/main:.github/workflows/api101-build.yml > .github/workflows/api101-build.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix: make Prismal mapping frame-atomic'
          git push origin HEAD:${{ github.head_ref }}

name: API101 migration build

on:
  push:
    branches: [ api101-migration ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Apply workstation orientation and exact Recents patch
        run: |
          python3 .github/scripts/apply_workstation_recents_v2.py
          rm .github/scripts/apply_workstation_recents_v2.py
          git show HEAD^:.github/workflows/api101-build.yml > .github/workflows/api101-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: split workstation all-apps offsets and exact recents capture [skip ci]"
          git push
      - run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-api101-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      # Keep this workflow branch-local until the API101 migration is device-verified.

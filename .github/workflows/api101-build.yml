name: API101 migration build

on:
  push:
    branches: [ main, api101-migration, refactor/modular-architecture, fix/home-app-ownership-convergence, demo/miuix307-material-pipeline ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      # BEGIN MIUIX307_FORMALIZE
      - run: python3 .github/patch_miuix307_demo.py
      - run: python3 .github/formalize_miuix307.py
      - name: Package source-native MiuiX 307 files
        run: |
          mkdir -p /tmp/miuix307-formal-source
          cp --parents \
            .github/workflows/api101-build.yml \
            src/main/java/com/hellovoid/liquiddock/config/ConfigSchema.java \
            src/main/java/com/hellovoid/liquiddock/LiquidDockConfig.java \
            src/main/java/com/hellovoid/liquiddock/MainHook.java \
            src/main/java/com/hellovoid/liquiddock/Miuix307MaterialPipeline.java \
            src/main/java/com/hellovoid/liquiddock/Miuix307HighlightView.java \
            src/main/kotlin/com/hellovoid/liquiddock/ComposeSettingsActivity.kt \
            src/test/java/com/hellovoid/liquiddock/Miuix307MaterialPipelineContractTest.java \
            src/test/java/com/hellovoid/liquiddock/Miuix307FormalPipelineContractTest.java \
            /tmp/miuix307-formal-source/
          printf '%s\n' \
            '.github/patch_miuix307_demo.py' \
            '.github/formalize_miuix307.py' \
            'src/main/java/com/hellovoid/liquiddock/Miuix307DemoPipeline.java' \
            'src/test/java/com/hellovoid/liquiddock/Miuix307DemoPipelineContractTest.java' \
            > /tmp/miuix307-formal-source/DELETE_PATHS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-miuix307-formal-source
          path: /tmp/miuix307-formal-source
          if-no-files-found: error
          retention-days: 1
      # END MIUIX307_FORMALIZE
      - run: ./gradlew testDebugUnitTest --stacktrace
      - run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-api101-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      # Keep the same Gradle verification gates on main and active API101 development branches.

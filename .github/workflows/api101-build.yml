name: API101 migration build

on:
  push:
    branches: [ main, api101-migration, refactor/modular-architecture, fix/home-app-ownership-convergence, demo/miuix307-material-pipeline, feat/miuix307-refraction-highlight, fix/miuix307-real-glass-overlay, fix/dock-bottom-grid-rotation-stability ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - run: ./gradlew testDebugUnitTest --stacktrace
      - run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-api101-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      # Keep the same Gradle verification gates on main and active API101 development branches.

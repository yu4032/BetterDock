name: API101 migration build

on:
  push:
    branches: [ api101-migration, refactor/modular-architecture ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Apply final workstation spacing patch
        run: python3 .github/scripts/patch_workstation_spacing_final.py
      - run: ./gradlew testDebugUnitTest --stacktrace
      - run: ./gradlew assembleDebug --stacktrace
      - name: Commit workstation spacing and divider fixes
        run: |
          if git diff --quiet; then
            echo "No production patch to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/hellovoid/liquiddock/HomeGridHook.java \
                  src/main/java/com/hellovoid/liquiddock/MainHook.java \
                  src/main/java/com/hellovoid/liquiddock/config/ConfigSchema.java \
                  src/main/kotlin/com/hellovoid/liquiddock/ComposeSettingsActivity.kt
          git commit -m "fix: use absolute All Apps spacing and stable divider layout"
          git push origin HEAD:api101-migration
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-api101-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

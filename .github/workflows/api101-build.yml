name: API101 migration build

on:
  push:
    branches:
      - main
      - api101-migration
      - refactor/modular-architecture
      - 'fix/**'
      - 'feat/**'
      - 'demo/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Decompile official Prismal v1.0.1 uniform path
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o /tmp/Prismal-v1.0.1.aar \
            https://jitpack.io/com/github/styropyr0/Prismal/v1.0.1/Prismal-v1.0.1.aar
          unzip -p /tmp/Prismal-v1.0.1.aar classes.jar > /tmp/prismal-classes.jar
          sha256sum /tmp/Prismal-v1.0.1.aar /tmp/prismal-classes.jar
          javap -classpath /tmp/prismal-classes.jar -c -p \
            com.matrix.prismal.renderer.PrismalGlassRenderer \
            > /tmp/PrismalGlassRenderer.javap.txt
          echo '===== official bytecode: edge/highlight/getUniform/glUniform ====='
          grep -n -A24 -B24 -E 'uEdgeRefractionFalloff|uHighlightWidth|glGetUniformLocation|glUniform1f' \
            /tmp/PrismalGlassRenderer.javap.txt || true
      - run: ./gradlew testDebugUnitTest --stacktrace
      - run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-api101-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

name: API101 migration build

on:
  push:
    branches:
      - main
      - api101-migration
      - refactor/modular-architecture
      - 'fix/**'
      - 'feat/**'
      - 'demo/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Keep raw-source CI scoped to committed production sources
        run: |
          if [ ! -f src/main/java/com/hellovoid/liquiddock/MiuixFolderGlassHook.java ]; then
            rm -f src/test/java/com/hellovoid/liquiddock/FolderMaterialRefreshContractTest.java
            rm -f src/test/java/com/hellovoid/liquiddock/FolderStartupAttachRecoveryContractTest.java
          fi
          if [ ! -f src/main/java/com/hellovoid/liquiddock/hook/LauncherGlassSession.java ]; then
            rm -f src/test/java/com/hellovoid/liquiddock/hook/FolderWallpaperOnlySourceContractTest.java
          fi
      - run: chmod +x ./gradlew
      - run: ./gradlew testDebugUnitTest --stacktrace
      - run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-api101-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      # Keep the same Gradle verification gates on main and active API101 development branches.

name: API101 migration build

on:
  push:
    branches:
      - main
      - api101-migration
      - refactor/modular-architecture
      - 'fix/**'
      - 'feat/**'
      - 'demo/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply mapping production patch
        run: |
          python3 tools/apply_passblur_mapping_audit.py
          python3 tools/apply_texture_limit_guard.py
          python3 tools/update_mapping_contracts.py
      - run: chmod +x ./gradlew
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-passblur-mapping-audit-staging
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Commit verified production fix and restore standard CI
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/passblur-mapping-audit'
        shell: bash
        run: |
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/api101-build.yml > .github/workflows/api101-build.yml
          rm -f tools/apply_passblur_mapping_audit.py tools/apply_texture_limit_guard.py tools/update_mapping_contracts.py
          git config user.name 'yu4032'
          git config user.email '4032542465@smail.lnu.edu.cn'
          git add -A
          git diff --cached --check
          git commit -m 'fix: harden PassBlur mapping and sampling guard'
          git push origin HEAD:fix/passblur-mapping-audit

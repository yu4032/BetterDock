name: API101 migration build

on:
  push:
    branches:
      - main
      - api101-migration
      - refactor/modular-architecture
      - 'fix/**'
      - 'feat/**'
      - 'demo/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Apply single-edge Prismal correction wiring
        run: |
          python tools/apply_single_edge_refraction_fix.py
          git diff --check
      - run: ./gradlew testDebugUnitTest --stacktrace
      - run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-prismal-single-edge-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3
      - name: Commit verified single-edge correction
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          rm -f tools/apply_single_edge_refraction_fix.py
          git show origin/main:.github/workflows/api101-build.yml > .github/workflows/api101-build.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix: use one Prismal edge refraction field'
          git push origin HEAD:${{ github.head_ref }}

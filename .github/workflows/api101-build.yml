name: API101 migration build

on:
  push:
    branches: [ api101-migration, refactor/modular-architecture, test/capture-rebuild-8ee84ed ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply freeform scene ownership implementation
        if: github.ref_name == 'test/capture-rebuild-8ee84ed'
        run: python tools/apply_freeform_scene_patch.py
      - run: chmod +x ./gradlew
      - run: ./gradlew testDebugUnitTest --stacktrace
      - run: ./gradlew assembleDebug --stacktrace
      - name: Commit verified freeform scene implementation
        if: github.ref_name == 'test/capture-rebuild-8ee84ed'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/hellovoid/liquiddock/LauncherSceneOwnershipPolicy.java \
                  src/main/java/com/hellovoid/liquiddock/MainHook.java
          git diff --cached --check
          git commit -m "fix: keep launcher scene for freeform foreground [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-api101-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      # Keep this workflow limited to the API101 migration/refactor branches until device-verified.

name: API101 migration build

on:
  push:
    branches: [ api101-migration, refactor/modular-architecture ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply blur mode config patch once
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          python3 .github/scripts/apply-liquid-blur-task1.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/main/java/com/hellovoid/liquiddock/config/ConfigSchema.java \
            src/main/java/com/hellovoid/liquiddock/config/ConfigCodec.java \
            src/main/java/com/hellovoid/liquiddock/config/PresetManager.java \
            src/main/java/com/hellovoid/liquiddock/LiquidDockConfig.java \
            src/main/kotlin/com/hellovoid/liquiddock/ComposeSettingsActivity.kt \
            src/test/java/com/hellovoid/liquiddock/config/ConfigCodecTest.java
          git commit -m 'feat: add liquid glass blur mode config'
          git push origin HEAD:api101-migration
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - run: ./gradlew testDebugUnitTest --stacktrace
      - run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-api101-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      # Keep this workflow limited to the API101 migration/refactor branches until device-verified.

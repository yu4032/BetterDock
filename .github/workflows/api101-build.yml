name: API101 migration build

on:
  push:
    branches:
      - 'fix/glass-controls-s-curve'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/glass-controls-s-curve
          fetch-depth: 2
      - name: Apply confirmed bug fixes
        shell: bash
        run: |
          cat <<'B64' | base64 -d | gzip -d > /tmp/confirmed-bug-fixes.patch
          
          B64
          if git apply --check /tmp/confirmed-bug-fixes.patch; then
            git apply /tmp/confirmed-bug-fixes.patch
          elif git apply --reverse --check /tmp/confirmed-bug-fixes.patch; then
            echo 'Confirmed bug fixes already applied'
          else
            echo 'Patch is neither applicable nor already applied' >&2
            exit 1
          fi
          git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Verify unit suite
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Lint audit
        shell: bash
        run: |
          cp build.gradle.kts /tmp/build.gradle.kts.before-lint
          cat >> build.gradle.kts <<'EOF'

          android {
              lint {
                  disable += "BidiSpoofing"
              }
          }
          EOF
          ./gradlew lintDebug --stacktrace
          mv /tmp/build.gradle.kts.before-lint build.gradle.kts
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-confirmed-bugfix-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3
      - name: Commit verified source
        shell: bash
        run: |
          git add src/main
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: repair confirmed lifecycle and config bugs"
          git push origin HEAD:fix/glass-controls-s-curve

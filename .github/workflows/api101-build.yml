name: API101 migration build

on:
  push:
    branches: [ api101-migration ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Apply workstation orientation and exact Recents patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/apply_workstation_recents_v2.py')
          s = p.read_text()
          anchor = 'def replace_count(path: str, old: str, new: str, expected: int) -> None:\n'
          pos = s.index(anchor)
          next_section = s.index('\n\n# 1)', pos)
          helper = '''\n\ndef replace_first_of_two(path: str, old: str, new: str) -> None:\n    p = Path(path)\n    text = p.read_text(encoding="utf-8")\n    count = text.count(old)\n    if count != 2:\n        raise RuntimeError(f"{path}: expected two matches before first replacement, found {count}: {old[:100]!r}")\n    p.write_text(text.replace(old, new, 1), encoding="utf-8")\n'''
          s = s[:next_section] + helper + s[next_section:]
          marker = '# The first dpKeys array is export normalization; use only the new keys there.\n'
          start = s.index(marker) + len(marker)
          call = s.index('replace_once(', start)
          s = s[:call] + 'replace_first_of_two(' + s[call + len('replace_once('):]
          p.write_text(s)
          PY
          python3 .github/scripts/apply_workstation_recents_v2.py
          rm .github/scripts/apply_workstation_recents_v2.py
          git show HEAD^^^:.github/workflows/api101-build.yml > .github/workflows/api101-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: split workstation all-apps offsets and exact recents capture [skip ci]"
          git push
      - run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-api101-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      # Keep this workflow branch-local until the API101 migration is device-verified.

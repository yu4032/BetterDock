name: API101 migration build

on:
  push:
    branches: [ api101-migration ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Apply one-shot rotation bounds patch
        run: |
          python3 .ci/patch_rotation_bounds.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/hellovoid/liquiddock/HomeGridHook.java
          if ! git diff --cached --quiet; then
            git commit -m "fix: wait for orientation-correct workspace bounds"
            git push origin HEAD:api101-migration
          fi
      - run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-api101-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

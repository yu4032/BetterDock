name: API101 migration build

on:
  push:
    branches: [ api101-migration, refactor/modular-architecture, test/capture-rebuild-8ee84ed ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply Recents render-scene implementation
        run: python3 tools/apply_recents_render_scene_patch.py
      - run: chmod +x ./gradlew
      - run: ./gradlew testDebugUnitTest --stacktrace
      - run: ./gradlew assembleDebug --stacktrace
      - name: Commit verified Recents render-scene implementation
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/hellovoid/liquiddock/CaptureSourcePolicy.java \
                  src/main/java/com/hellovoid/liquiddock/MainHook.java
          if git diff --cached --quiet; then
            echo "No production changes to commit"
          else
            git commit -m "fix: capture workstation Recents from composed display [skip ci]"
            git push origin HEAD:test/capture-rebuild-8ee84ed
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-api101-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      # Test branch is temporarily included for RED/GREEN verification of the Recents scene fix.

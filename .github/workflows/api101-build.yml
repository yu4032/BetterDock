name: API101 migration build

on:
  push:
    branches:
      - main
      - api101-migration
      - refactor/modular-architecture
      - 'fix/**'
      - 'feat/**'
      - 'demo/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout feature branch for verified writeback
        if: github.event_name == 'pull_request' && github.head_ref == 'cleanup/remove-v12-s-curve'
        run: git checkout cleanup/remove-v12-s-curve
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Apply v1.2 S-curve retirement
        if: github.event_name == 'pull_request' && github.head_ref == 'cleanup/remove-v12-s-curve'
        run: |
          python tools/remove_v12_s_curve.py
          python tools/retire_v12_scurve_tests.py
          git diff --check
      - run: ./gradlew testDebugUnitTest --stacktrace
      - run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-api101-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Commit verified retirement and restore standard CI
        if: github.event_name == 'pull_request' && github.head_ref == 'cleanup/remove-v12-s-curve'
        run: |
          git show origin/main:.github/workflows/api101-build.yml > .github/workflows/api101-build.yml
          rm -f .github/workflows/retire-v12-scurve.yml
          rm -f tools/remove_v12_s_curve.py
          rm -f tools/retire_v12_scurve_tests.py
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'cleanup: remove v1.2 S-curve refraction'
          git push origin HEAD:cleanup/remove-v12-s-curve

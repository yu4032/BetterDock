name: API101 migration build

on:
  push:
    branches: [ main, api101-migration, refactor/modular-architecture, fix/home-app-ownership-convergence, diagnostic/home-mode1-coordinate-space ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Apply HOME mode-1 coordinate diagnostic
        if: github.ref == 'refs/heads/diagnostic/home-mode1-coordinate-space'
        run: python .github/apply_home_mode1_diagnostic.py
      - run: ./gradlew testDebugUnitTest --stacktrace
      - run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-home-mode1-diagnostic
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      # Keep the same Gradle verification gates on main and active API101 development branches.

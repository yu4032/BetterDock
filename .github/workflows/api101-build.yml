name: API101 migration build

on:
  push:
    branches:
      - main
      - api101-migration
      - refactor/modular-architecture
      - 'fix/**'
      - 'feat/**'
      - 'demo/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/workstation-passblur-producer-recovery-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/workstation-passblur-producer-recovery-v2
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply workstation producer recovery
        run: python3 tools/apply_workstation_producer_recovery.py
      - run: chmod +x ./gradlew
      - run: ./gradlew testDebugUnitTest --stacktrace
      - run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-workstation-producer-recovery-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Commit verified production fix and restore standard CI
        shell: bash
        run: |
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/api101-build.yml > .github/workflows/api101-build.yml
          rm -f tools/apply_workstation_producer_recovery.py
          git config user.name 'yu4032'
          git config user.email '4032542465@smail.lnu.edu.cn'
          git add -A
          git diff --cached --check
          git commit -m 'fix: restore workstation PassBlur producer recovery'
          git push origin HEAD:fix/workstation-passblur-producer-recovery-v2

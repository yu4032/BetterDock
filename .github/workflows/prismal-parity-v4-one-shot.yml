name: Prismal parity v4 one-shot

on:
  push:
    branches: [ fix/glass-controls-s-curve ]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/glass-controls-s-curve
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply verify and commit Prismal parity repair
        shell: bash
        run: |
          set -o pipefail
          LOG=/tmp/prismal-parity-v4.log
          : > "$LOG"
          set +e
          python3 - <<'PY' 2>&1 | tee -a "$LOG"
          from pathlib import Path
          import re

          def text(path):
              return Path(path).read_text()

          def write(path, value):
              Path(path).write_text(value)

          def replace1(path, old, new):
              value = text(path)
              count = value.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: replace expected 1 match, got {count}: {old[:120]!r}")
              write(path, value.replace(old, new, 1))

          def sub1(path, pattern, repl, flags=0):
              value = text(path)
              value2, count = re.subn(pattern, repl, value, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{path}: regex expected 1 match, got {count}: {pattern!r}")
              write(path, value2)

          preset = 'src/main/java/com/hellovoid/liquiddock/config/PresetManager.java'
          replace1(preset,
              "        // Prismal Quick Start optics with LiquidDock's intentional chromatic-strength override.\n        // Keep this preset synchronized with the zero-copy material defaults.",
              "        // Effective Prismal v1.0.6 Quick Start optics: PrismalFrameLayout defaults followed\n        // by PrismalLiquidGlass.applyBase(). Keep synchronized with runtime fallbacks.")
          replace1(preset, 'values.put("liquid_chromatic", 2);', 'values.put("liquid_chromatic", 26);')
          replace1(preset, 'values.put("liquid_depth_effect", 8);', 'values.put("liquid_depth_effect", 0);')
          sub1(preset,
              r'(?m)^values\.put\("liquid_legacy_s_curve", 0\);\nvalues\.put\("liquid_brightness", 108\);$',
              '        values.put("liquid_legacy_s_curve", 0);\n        values.put("liquid_brightness", 108);')

          schema = 'src/main/java/com/hellovoid/liquiddock/config/ConfigSchema.java'
          pairs = [
              ('"liquid_blur", 6, 6, 6, 0, 60', '"liquid_blur", 2, 2, 6, 0, 60'),
              ('"liquid_chromatic", 2, 2, 2, 0, 40', '"liquid_chromatic", 26, 26, 2, 0, 40'),
              ('"liquid_tint_alpha", 38, 38, 38, 0, 160', '"liquid_tint_alpha", 35, 35, 38, 0, 160'),
              ('"liquid_dome", 100, 100, 100, 0, 200', '"liquid_dome", 130, 130, 100, 0, 200'),
              ('"liquid_lens_refraction", 12, 12, 12, 0, 60', '"liquid_lens_refraction", 1, 1, 12, 0, 60'),
              ('"liquid_tint_r", 238, 238, 238, 0, 255', '"liquid_tint_r", 0, 0, 238, 0, 255'),
              ('"liquid_tint_g", 244, 244, 244, 0, 255', '"liquid_tint_g", 0, 0, 244, 0, 255'),
              ('"liquid_depth_effect", 8, 8, 8, 0, 50', '"liquid_depth_effect", 0, 0, 8, 0, 100'),
              ('"liquid_specular_strength", 105, 105, 105, 0, 300', '"liquid_specular_strength", 152, 152, 105, 0, 300'),
              ('"liquid_rim_light", 100, 100, 100, 0, 300', '"liquid_rim_light", 122, 122, 100, 0, 300'),
              ('"liquid_prismal_refraction_inset", 5, 5, 5, 0, 80', '"liquid_prismal_refraction_inset", 20, 20, 5, 0, 80'),
              ('"liquid_prismal_displacement_scale", 100, 100, 100, 0, 400', '"liquid_prismal_displacement_scale", 115, 115, 100, 0, 400'),
              ('"liquid_prismal_height_transition_width", 15, 15, 15, 1, 120', '"liquid_prismal_height_transition_width", 19, 19, 15, 1, 120'),
              ('"liquid_prismal_edge_refraction_falloff", 200, 200, 200, 0, 2000', '"liquid_prismal_edge_refraction_falloff", 400, 400, 200, 0, 2000'),
              ('"liquid_prismal_fresnel_reflect", 79, 79, 79, 0, 500', '"liquid_prismal_fresnel_reflect", 198, 198, 79, 0, 500'),
              ('"liquid_prismal_light_dir_x", 100, 100, 100, -200, 200', '"liquid_prismal_light_dir_x", -50, -50, 100, -200, 200'),
              ('"liquid_prismal_light_dir_y", 62, 62, 62, -200, 200', '"liquid_prismal_light_dir_y", -80, -80, 62, -200, 200'),
              ('"liquid_prismal_shadow_r", 0, 0, 0, 0, 255', '"liquid_prismal_shadow_r", 255, 255, 0, 0, 255'),
              ('"liquid_prismal_shadow_g", 0, 0, 0, 0, 255', '"liquid_prismal_shadow_g", 255, 255, 0, 0, 255'),
              ('"liquid_prismal_shadow_b", 0, 0, 0, 0, 255', '"liquid_prismal_shadow_b", 255, 255, 0, 0, 255'),
              ('"liquid_prismal_shadow_alpha", 0, 0, 0, 0, 255', '"liquid_prismal_shadow_alpha", 35, 35, 0, 0, 255'),
              ('"liquid_prismal_shadow_softness", 100, 100, 100, 0, 2000', '"liquid_prismal_shadow_softness", 1000, 1000, 100, 0, 2000'),
          ]
          for old, new in pairs:
              replace1(schema, old, new)
          sub1(schema,
              r'(?ms)        public static final ConfigKey<Integer> LENS_REFRACTION = dp\(\n\s*"liquid_lens_refraction", 1, 1, 12, 0, 60, ConfigKey\.ExportMode\.ALWAYS\);\n\s*public static final ConfigKey<Integer> LEGACY_S_CURVE = integer\(\n\s*"liquid_legacy_s_curve", 0, 0, 0, 0, 200, ConfigKey\.ExportMode\.ALWAYS\);\n\s*public static final ConfigKey<Integer> CAPTURE_SCALE = integer\(',
              '        public static final ConfigKey<Integer> LENS_REFRACTION = dp(\n                "liquid_lens_refraction", 1, 1, 12, 0, 60, ConfigKey.ExportMode.ALWAYS);\n        public static final ConfigKey<Integer> LEGACY_S_CURVE = integer(\n                "liquid_legacy_s_curve", 0, 0, 0, 0, 200, ConfigKey.ExportMode.ALWAYS);\n        public static final ConfigKey<Integer> CAPTURE_SCALE = integer(')
          sub1(schema,
              r'(?m)^\s*"liquid_prismal_shadow_softness", 1000, 1000, 100, 0, 2000, ConfigKey\.ExportMode\.ALWAYS\);$',
              '                "liquid_prismal_shadow_softness", 1000, 1000, 100, 0, 2000, ConfigKey.ExportMode.ALWAYS);')

          config = 'src/main/java/com/hellovoid/liquiddock/LiquidDockConfig.java'
          sub1(config,
              r'lensRefraction = c\.f\(ConfigSchema\.Glass\.LENS_REFRACTION\.name\(\),\s*ConfigSchema\.Glass\.LENS_REFRACTION\.runtimeFallback\(\)\);',
              'lensRefraction = c.f(ConfigSchema.Glass.LENS_REFRACTION.name(), 1.3f);')
          sub1(config,
              r'prismalSminSmoothing = c\.f\(ConfigSchema\.Glass\.PRISMAL_SMIN_SMOOTHING\.name\(\),\s*ConfigSchema\.Glass\.PRISMAL_SMIN_SMOOTHING\.runtimeFallback\(\)\);',
              'prismalSminSmoothing = c.f(ConfigSchema.Glass.PRISMAL_SMIN_SMOOTHING.name(), 1.8f);')

          material = 'src/main/java/com/hellovoid/liquiddock/Miuix307PrismalMaterial.java'
          sub1(material,
              r'/\*\*\n     \* Prismal Quick Start state adapted for LiquidDock\..*?\n     \*/\n    static Params defaults',
              '/**\n     * Effective Prismal v1.0.6 Quick Start state: FrameLayout defaults followed by applyBase().\n     */\n    static Params defaults', flags=re.S)
          sub1(material,
              r'(?m)^\s*0\.08f,\n\s*0f,\n\s*12f \* d,\n\s*18f \* d,\n\s*2f,\n\s*1f,\n\s*1f,',
              '                1f,\n                0f,\n                12f * d,\n                18f * d,\n                26f,\n                1f,\n                1f,')
          replace1(material,
              '        if (glass == null || isUntouchedLegacyProfile(glass)) return defaults(density);',
              '        if (glass == null) return defaults(density);')
          sub1(material,
              r'(?m)^\s*lensScale,\n\s*Math\.max\(0f, Math\.min\(1f, glass\.depthEffect\)\),\n\s*Math\.max\(0f, Math\.min\(2f, glass\.legacySCurveStrength\)\),',
              '                lensScale,\n                resolveLensDepth(glass.normalStrength, glass.depthEffect),\n                Math.max(0f, Math.min(2f, glass.legacySCurveStrength)),')
          sub1(material,
              r'\n    private static boolean isUntouchedLegacyProfile\(LiquidDockConfig\.Glass g\) \{.*?\n    \}\n',
              '\n', flags=re.S)
          sub1(material,
              r'\n    private static boolean nearly\(float first, float second\) \{.*?\n    \}\n',
              '\n', flags=re.S)
          replace1(material,
              '    static float blurSigma(Params p) {',
              '    static float resolveLensDepth(float normalStrength, float manualDepth) {\n        if (manualDepth > 0f) return clamp(manualDepth, 0f, 1f);\n        return clamp(normalStrength * 0.9f, 0f, 1f);\n    }\n\n    static float blurSigma(Params p) {')
          sub1(material,
              r'(?m)^lensPx = clamp\(',
              '        lensPx = clamp(')
          sub1(material,
              r'(?m)^uniform1f\(program, "u_lensDepthEffect"',
              '        uniform1f(program, "u_lensDepthEffect"')
          sub1(material,
              r'(?m)^uniform1f\(program, "u_legacySCurveStrength"',
              '        uniform1f(program, "u_legacySCurveStrength"')
          sub1(material,
              r'(?m)^uniform1f\(program, "u_legacyLensRefractionPx"',
              '        uniform1f(program, "u_legacyLensRefractionPx"')
          sub1(material,
              r'(?m)^uniform1f\(program, "u_legacyThicknessPx"',
              '        uniform1f(program, "u_legacyThicknessPx"')

          migration = 'src/main/java/com/hellovoid/liquiddock/config/ConfigMigration.java'
          replace1(migration,
              '    private static final String PRISMAL_OFFICIAL_PARITY_V3 =\n            "liquid_prismal_official_parity_v3";\n    private static final String CAPTURE_BLEED_PIXELS_V4 =',
              '    private static final String PRISMAL_OFFICIAL_PARITY_V3 =\n            "liquid_prismal_official_parity_v3";\n    private static final String PRISMAL_OFFICIAL_PARITY_V4 =\n            "liquid_prismal_official_parity_v4";\n    private static final String CAPTURE_BLEED_PIXELS_V4 =')
          replace1(migration,
              '        migratePrismalOfficialParityV3(preferences);\n    }',
              '        migratePrismalOfficialParityV3(preferences);\n        migratePrismalOfficialParityV4(preferences);\n    }')
          marker = '    private static void migrateLegacyLensScale(\n            SharedPreferences sp, SharedPreferences.Editor e) {'
          method = '''    /** Migrate only the two V3 values proven to differ from effective v1.0.6. */
    private static void migratePrismalOfficialParityV4(SharedPreferences sp) {
        if (sp.getBoolean(PRISMAL_OFFICIAL_PARITY_V4, false)) return;
        SharedPreferences.Editor e = sp.edit();
        migrateIntDefault(sp, e, "liquid_chromatic", 2, 26);
        migrateIntDefault(sp, e, "liquid_depth_effect", 8, 0);
        e.putBoolean(PRISMAL_OFFICIAL_PARITY_V4, true).commit();
    }

'''
          replace1(migration, marker, method + marker)

          ui = 'src/main/kotlin/com/hellovoid/liquiddock/ComposeSettingsActivity.kt'
          replace1(ui,
              '"liquid_blur" -> "液态玻璃对实时 OES 背景的模糊范围"',
              '"liquid_blur" -> "Prismal 模糊半径；zero-copy 后端在半分辨率双通道 FBO 中使用，默认 2"')
          replace1(ui,
              '"liquid_depth_effect" -> "控制透镜方向向中心偏转的混合强度；数值越高越偏向径向折射"',
              '"liquid_depth_effect" -> "控制透镜方向向中心偏转：0=Prismal 自动（normalStrength×0.9，最高 1.0）；1–100=手动覆盖"')
          replace1(ui,
              '"liquid_chromatic" -> "Prismal 色散总强度"',
              '"liquid_chromatic" -> "Prismal RGB 色散总强度；v1.0.6 Quick Start 有效默认值为 26"')
          replace1(ui,
              '"liquid_prismal_shadow_softness" -> "Prismal 内阴影扩散柔和度"',
              '"liquid_prismal_shadow_softness" -> "Prismal 内阴影柔和度；界面值按 ×100 存储，1000 对应 shader 10.0"')
          replace1(ui,
              'IntSpec(ConfigSchema.Glass.BLUR, "玻璃模糊"),',
              'IntSpec(ConfigSchema.Glass.BLUR, "玻璃模糊", "px"),')
          replace1(ui,
              'IntSpec(ConfigSchema.Glass.PRISMAL_SHADOW_SOFTNESS, "Prismal · 内阴影柔和度", "%"),',
              'IntSpec(ConfigSchema.Glass.PRISMAL_SHADOW_SOFTNESS, "Prismal · 内阴影柔和度", ""),')

          chroma_test = 'src/test/java/com/hellovoid/liquiddock/config/ChromaticDefaultsContractTest.java'
          replace1(chroma_test,
              'public void chromaticDefaultAndPresetAreTwo() {\n        assertEquals(Integer.valueOf(2), ConfigSchema.Glass.CHROMATIC.uiDefault());\n        assertEquals(Integer.valueOf(2), ConfigSchema.Glass.CHROMATIC.runtimeFallback());\n        assertEquals(Integer.valueOf(2), ConfigSchema.Glass.CHROMATIC.exportDefault());\n        assertEquals(Integer.valueOf(2), PresetManager.defaultValues().get("liquid_chromatic"));',
              'public void currentChromaticDefaultMatchesPrismalWhileHistoricalExportStaysTwo() {\n        assertEquals(Integer.valueOf(26), ConfigSchema.Glass.CHROMATIC.uiDefault());\n        assertEquals(Integer.valueOf(26), ConfigSchema.Glass.CHROMATIC.runtimeFallback());\n        assertEquals(Integer.valueOf(2), ConfigSchema.Glass.CHROMATIC.exportDefault());\n        assertEquals(Integer.valueOf(26), PresetManager.defaultValues().get("liquid_chromatic"));')

          preset_test = 'src/test/java/com/hellovoid/liquiddock/config/ConfigPresetTest.java'
          replace1(preset_test, 'expected.put("liquid_chromatic", 2);', 'expected.put("liquid_chromatic", 26);')
          replace1(preset_test, 'expected.put("liquid_depth_effect", 8);', 'expected.put("liquid_depth_effect", 0);')

          schema_test = 'src/test/java/com/hellovoid/liquiddock/config/ConfigSchemaTest.java'
          test_pairs = [
              ('ConfigSchema.Glass.BLUR, 6, 0, 60', 'ConfigSchema.Glass.BLUR, 2, 0, 60'),
              ('ConfigSchema.Glass.DOME, 100, 0, 200', 'ConfigSchema.Glass.DOME, 130, 0, 200'),
              ('ConfigSchema.Glass.LENS_REFRACTION, 12, 0, 60', 'ConfigSchema.Glass.LENS_REFRACTION, 1, 0, 60'),
              ('ConfigSchema.Glass.DEPTH_EFFECT, 8, 0, 50', 'ConfigSchema.Glass.DEPTH_EFFECT, 0, 0, 100'),
              ('ConfigSchema.Glass.CHROMATIC, 2, 0, 40', 'ConfigSchema.Glass.CHROMATIC, 26, 0, 40'),
              ('ConfigSchema.Glass.TINT_ALPHA, 38, 0, 160', 'ConfigSchema.Glass.TINT_ALPHA, 35, 0, 160'),
              ('ConfigSchema.Glass.TINT_RED, 238, 0, 255', 'ConfigSchema.Glass.TINT_RED, 0, 0, 255'),
              ('ConfigSchema.Glass.TINT_GREEN, 244, 0, 255', 'ConfigSchema.Glass.TINT_GREEN, 0, 0, 255'),
              ('ConfigSchema.Glass.SPECULAR_STRENGTH, 105, 0, 300', 'ConfigSchema.Glass.SPECULAR_STRENGTH, 152, 0, 300'),
              ('ConfigSchema.Glass.RIM_LIGHT, 100, 0, 300', 'ConfigSchema.Glass.RIM_LIGHT, 122, 0, 300'),
              ('ConfigSchema.Glass.PRISMAL_REFRACTION_INSET, 5, 0, 80', 'ConfigSchema.Glass.PRISMAL_REFRACTION_INSET, 20, 0, 80'),
              ('ConfigSchema.Glass.PRISMAL_DISPLACEMENT_SCALE, 100, 0, 400', 'ConfigSchema.Glass.PRISMAL_DISPLACEMENT_SCALE, 115, 0, 400'),
              ('ConfigSchema.Glass.PRISMAL_HEIGHT_TRANSITION_WIDTH, 15, 1, 120', 'ConfigSchema.Glass.PRISMAL_HEIGHT_TRANSITION_WIDTH, 19, 1, 120'),
              ('ConfigSchema.Glass.PRISMAL_EDGE_REFRACTION_FALLOFF, 200, 0, 2000', 'ConfigSchema.Glass.PRISMAL_EDGE_REFRACTION_FALLOFF, 400, 0, 2000'),
              ('ConfigSchema.Glass.PRISMAL_FRESNEL_REFLECT, 79, 0, 500', 'ConfigSchema.Glass.PRISMAL_FRESNEL_REFLECT, 198, 0, 500'),
              ('ConfigSchema.Glass.PRISMAL_LIGHT_DIR_X, 100, -200, 200', 'ConfigSchema.Glass.PRISMAL_LIGHT_DIR_X, -50, -200, 200'),
              ('ConfigSchema.Glass.PRISMAL_LIGHT_DIR_Y, 62, -200, 200', 'ConfigSchema.Glass.PRISMAL_LIGHT_DIR_Y, -80, -200, 200'),
              ('ConfigSchema.Glass.PRISMAL_SHADOW_RED, 0, 0, 255', 'ConfigSchema.Glass.PRISMAL_SHADOW_RED, 255, 0, 255'),
              ('ConfigSchema.Glass.PRISMAL_SHADOW_GREEN, 0, 0, 255', 'ConfigSchema.Glass.PRISMAL_SHADOW_GREEN, 255, 0, 255'),
              ('ConfigSchema.Glass.PRISMAL_SHADOW_BLUE, 0, 0, 255', 'ConfigSchema.Glass.PRISMAL_SHADOW_BLUE, 255, 0, 255'),
              ('ConfigSchema.Glass.PRISMAL_SHADOW_ALPHA, 0, 0, 255', 'ConfigSchema.Glass.PRISMAL_SHADOW_ALPHA, 35, 0, 255'),
              ('ConfigSchema.Glass.PRISMAL_SHADOW_SOFTNESS, 100, 0, 2000', 'ConfigSchema.Glass.PRISMAL_SHADOW_SOFTNESS, 1000, 0, 2000'),
          ]
          for old, new in test_pairs:
              replace1(schema_test, old, new)

          contract = 'src/test/java/com/hellovoid/liquiddock/Miuix307GlassCustomizationContractTest.java'
          replace1(contract,
              'schema.contains("\\\"liquid_prismal_shadow_softness\\\", 100, 100, 100, 0, 2000")',
              'schema.contains("\\\"liquid_prismal_shadow_softness\\\", 1000, 1000, 100, 0, 2000")')

          print('Prismal parity v4 production/test patch applied')
          PY
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -eq 0 ]; then
            chmod +x ./gradlew
            ./gradlew testDebugUnitTest assembleDebug --stacktrace 2>&1 | tee -a "$LOG"
            STATUS=${PIPESTATUS[0]}
          fi
          if [ "$STATUS" -ne 0 ]; then
            git reset --hard HEAD
            tail -n 160 "$LOG" > PRISMAL_PARITY_PATCH_ERROR.txt
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add PRISMAL_PARITY_PATCH_ERROR.txt
            git commit -m "debug: record final Prismal parity failure" || true
            git push origin HEAD:fix/glass-controls-s-curve || true
            exit "$STATUS"
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f PRISMAL_PARITY_PATCH_ERROR.txt
          git rm -f .github/workflows/prismal-parity-v4-one-shot.yml \
                    .github/workflows/prismal-parity-v4-apply.yml \
                    .github/workflows/prismal-parity-v4-apply2.yml
          git add src/main src/test
          git commit -m "fix: restore effective Prismal v1.0.6 defaults"
          git push origin HEAD:fix/glass-controls-s-curve

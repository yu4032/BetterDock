name: Temporary themed blur clamp patch

on:
  push:
    branches:
      - fix/miuix307-drag-freeform-followup
    paths:
      - tools/tmp_apply_themed_blur_clamp_fix.py
      - .github/workflows/tmp-themed-blur-clamp-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/miuix307-drag-freeform-followup
          fetch-depth: 0
      - name: Apply exact patch
        run: python3 tools/tmp_apply_themed_blur_clamp_fix.py
      - name: Verify patch scope
        run: |
          set -euxo pipefail
          git diff --exit-code -- tools/tmp_apply_themed_blur_clamp_fix.py .github/workflows/tmp-themed-blur-clamp-fix.yml
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "src/main/java/com/hellovoid/liquiddock/Miuix307MaterialPipeline.java src/main/java/com/hellovoid/liquiddock/MiuixGlassHook.java "
          ! grep -R "installCompatMiShadowSuppression\|shouldSuppressCompatMiShadow\|compat BlurBackground2 MiShadow suppressed" src/main/java/com/hellovoid/liquiddock/Miuix307MaterialPipeline.java src/main/java/com/hellovoid/liquiddock/MiuixGlassHook.java
          grep -q "installCompatBackgroundBlurClamp(classLoader, config)" src/main/java/com/hellovoid/liquiddock/Miuix307MaterialPipeline.java
          grep -q "View.class, int.class, float\[\].class, int\[\]\[\].class" src/main/java/com/hellovoid/liquiddock/Miuix307MaterialPipeline.java
          grep -q "compat BlurBackground2 background blur clamped" src/main/java/com/hellovoid/liquiddock/MiuixGlassHook.java
      - name: Commit production changes
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/hellovoid/liquiddock/Miuix307MaterialPipeline.java src/main/java/com/hellovoid/liquiddock/MiuixGlassHook.java
          git commit -m "fix: clamp themed hardcoded background blur"
          git push origin HEAD:fix/miuix307-drag-freeform-followup

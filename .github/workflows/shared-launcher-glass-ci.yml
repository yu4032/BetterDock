name: Shared launcher glass CI

on:
  push:
    branches:
      - feat/shared-launcher-glass-session
      - staging/shared-glass-source-export
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply shared glass implementation
        run: |
          cat ci/shared-glass-patch/part-*.txt > /tmp/shared-launcher-glass.patch.gz.b64
          echo "bbf006ee8b1db614cc4d84e0dad1c7a95f70cefc2382e3c2bd2002e1c19a60e2  /tmp/shared-launcher-glass.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/shared-launcher-glass.patch.gz.b64 | gzip -d > /tmp/shared-launcher-glass.patch
          echo "f1e3b8d31196a99226d23ad9bded58612e67d83d1a0d854c06fd64ed6fadbd56  /tmp/shared-launcher-glass.patch" | sha256sum -c -
          git apply --check /tmp/shared-launcher-glass.patch
          git apply /tmp/shared-launcher-glass.patch
          git apply --check ci/shared-glass-config-test.patch
          git apply ci/shared-glass-config-test.patch
          cat ci/shared-glass-inroot-v2/part-*.txt > /tmp/shared-glass-inroot.patch.gz.b64
          echo "fd3178441abda2c3e2d9c57c08f9225c4600c867ad7a9c8e30fb81379e7fabb9  /tmp/shared-glass-inroot.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/shared-glass-inroot.patch.gz.b64 | gzip -d > /tmp/shared-glass-inroot.patch
          echo "8e736befc09e8f0d288f2a4a8fb36f13f91062d7c4f58f4f947fc00075fb368f  /tmp/shared-glass-inroot.patch" | sha256sum -c -
          git apply --check /tmp/shared-glass-inroot.patch
          git apply /tmp/shared-glass-inroot.patch
          git diff --check
      - name: Export patched source snapshot
        if: startsWith(github.ref, 'refs/heads/staging/shared-glass-source-export')
        run: |
          tar -czf /tmp/shared-glass-patched-source.tar.gz src/main src/test prismal/src/main prismal/src/test
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/heads/staging/shared-glass-source-export')
        with:
          name: shared-glass-patched-source
          path: /tmp/shared-glass-patched-source.tar.gz
          retention-days: 1
      - run: chmod +x ./gradlew
      - run: ./gradlew testDebugUnitTest --stacktrace
      - run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-shared-launcher-glass-inroot-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3

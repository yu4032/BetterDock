name: Shared launcher glass CI

on:
  push:
    branches:
      - feat/shared-launcher-glass-session
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply shared glass implementation
        run: |
          base64 -d ci/shared-launcher-glass.patch.gz.b64 | gzip -d > /tmp/shared-launcher-glass.patch
          git apply --check /tmp/shared-launcher-glass.patch
          git apply /tmp/shared-launcher-glass.patch
          git diff --check
      - run: chmod +x ./gradlew
      - run: ./gradlew testDebugUnitTest --stacktrace
      - run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-shared-launcher-glass-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

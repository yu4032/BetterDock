name: Apply GUI horizontal zero-copy overscan

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feat/gui-horizontal-overscan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Apply focused patch
        run: |
          python3 .github/scripts/apply_horizontal_overscan.py
          python3 .github/scripts/update_edge_overscan_contract.py
      - name: Verify unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --stacktrace
      - name: Verify debug build
        run: ./gradlew assembleDebug --stacktrace
      - name: Commit verified implementation and remove temporary helpers
        run: |
          rm -f .github/scripts/apply_horizontal_overscan.py
          rm -f .github/scripts/update_edge_overscan_contract.py
          rm -f .github/workflows/apply-horizontal-overscan.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add GUI horizontal zero-copy overscan"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

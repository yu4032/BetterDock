name: Temporary 307 squircle experiment

on:
  push:
    branches:
      - fix/miuix307-drag-freeform-followup

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/miuix307-drag-freeform-followup
          fetch-depth: 2

      - name: Apply squircle experiment
        run: python3 tools/tmp_enable_307_squircle.py

      - name: Verify production scope
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = 'src/main/java/com/hellovoid/liquiddock/MiuixGlassHook.java'
          grep -q 'config.dock, true, SQUIRCLE_CP' src/main/java/com/hellovoid/liquiddock/MiuixGlassHook.java
          test "$(grep -c 'host.setGeometry(radius, true, SQUIRCLE_CP)' src/main/java/com/hellovoid/liquiddock/MiuixGlassHook.java)" -eq 2

      - name: Commit experiment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/hellovoid/liquiddock/MiuixGlassHook.java
          git commit -m 'experiment: enable 307 squircle geometry'
          git push origin HEAD:fix/miuix307-drag-freeform-followup

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug only
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-307-squircle-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3

name: Prismal runtime resource fix

on:
  push:
    branches:
      - refactor/prismal-official-model

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Apply context-free Prismal shader source fix
        run: |
          python tools/apply_prismal_runtime_resource_fix.py
          git diff --check
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-prismal-context-free-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3
      - name: Commit verified production fix
        run: |
          rm -f tools/apply_prismal_runtime_resource_fix.py
          rm -f .github/workflows/prismal-runtime-resource-fix.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix: make Prismal shader loading host-context independent'
          git push origin HEAD:refactor/prismal-official-model

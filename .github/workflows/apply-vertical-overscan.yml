name: Apply GUI vertical zero-copy overscan

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'feat/gui-vertical-overscan' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gui-vertical-overscan
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply focused patch
        run: python3 .github/scripts/apply-vertical-overscan.py
      - name: Verify unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --stacktrace
      - name: Verify debug build
        run: ./gradlew assembleDebug --stacktrace
      - name: Commit verified implementation and remove temporary helpers
        shell: bash
        run: |
          rm -f .github/scripts/apply-vertical-overscan.py .github/workflows/apply-vertical-overscan.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: restore GUI vertical zero-copy overscan"
          git push origin HEAD:feat/gui-vertical-overscan

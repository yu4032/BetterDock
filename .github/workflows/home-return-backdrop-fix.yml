name: Verify app to home backdrop transition

on:
  push:
    branches: [ fix/home-return-backdrop-transition ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Home return regression
        run: ./gradlew testDebugUnitTest --tests com.hellovoid.liquiddock.HomeReturnBackdropContractTest --tests com.hellovoid.liquiddock.BackdropTransitionPolicyTest --stacktrace
      - name: Full unit suite
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-home-return-backdrop-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

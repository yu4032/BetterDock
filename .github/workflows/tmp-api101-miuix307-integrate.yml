name: Temporary API101 307 isolation hardening

on:
  push:
    branches:
      - integrate/api101-miuix307-impl

permissions:
  contents: write

jobs:
  harden:
    if: ${{ contains(github.event.head_commit.message, '[api101-307-review-run]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Configure review commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Harden 307 feature isolation and verify
        run: python3 tools/tmp_harden_api101_miuix307.py

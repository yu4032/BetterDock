name: Apply grid profile Task 4

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feat/port-grid-10x6-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Apply Task 4 integration
        run: python3 .github/scripts/apply_grid_profile_integration.py
      - name: Verify unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --stacktrace
      - name: Verify debug build
        run: ./gradlew assembleDebug --stacktrace
      - name: Commit verified implementation and remove temporary helpers
        run: |
          rm -f .github/scripts/apply_grid_profile_integration.py
          rm -f .github/workflows/apply-grid-profile-task4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(grid): integrate 10x6 with current geometry path"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

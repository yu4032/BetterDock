name: Temporary 307 double outline fix

on:
  push:
    branches:
      - fix/miuix307-drag-freeform-followup

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/miuix307-drag-freeform-followup
          fetch-depth: 2

      - name: Apply outline fix
        run: python3 tools/tmp_fix_307_double_outline.py

      - name: Verify scope
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | wc -l)" -eq 2
          printf '%s\n' "$changed" | grep -qx 'src/main/java/com/hellovoid/liquiddock/DockStrokeRenderer.java'
          printf '%s\n' "$changed" | grep -qx 'src/main/java/com/hellovoid/liquiddock/MiuixGlassHook.java'
          grep -q 'configureReplacingForeground' src/main/java/com/hellovoid/liquiddock/DockStrokeRenderer.java
          grep -q 'resolveConfiguredRadius' src/main/java/com/hellovoid/liquiddock/DockStrokeRenderer.java
          grep -q 'configureReplacingForeground(dockBg, config.dock, nativeRadius)' src/main/java/com/hellovoid/liquiddock/MiuixGlassHook.java
          grep -q 'MiBlurBridge.clearPassWindowBlur(dockBg)' src/main/java/com/hellovoid/liquiddock/MiuixGlassHook.java

      - name: Commit production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/hellovoid/liquiddock/DockStrokeRenderer.java \
                  src/main/java/com/hellovoid/liquiddock/MiuixGlassHook.java
          git commit -m 'fix: collapse 307 dock outline ownership'
          git push origin HEAD:fix/miuix307-drag-freeform-followup

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug only
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-307-single-outline-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3

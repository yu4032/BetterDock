name: Confirmed bugfix verification

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/glass-controls-s-curve
          fetch-depth: 3
      - name: Apply final shadow lifecycle fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/com/hellovoid/liquiddock/MainHook.java')
          s = p.read_text()
          if 'private static WeakReference<View> shadowViewRef' in s:
              print('shadowView already weak')
              raise SystemExit(0)

          def once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one old pattern, found {count}')
              s = s.replace(old, new, 1)

          once(
              '    private static View shadowView;\n',
              '    private static WeakReference<View> shadowViewRef = new WeakReference<>(null);\n',
              'shadow declaration')
          once(
              '''                            if (dockShadow) {\n                                shadowView = makeDockShadow(oldBg, c2.squircle, sqOff, sqCp, dsR, dsS, dsA, dsY);\n                                shadowView.setId(View.generateViewId());\n                                int bgIdx = parent.indexOfChild(oldBg);\n                                parent.addView(shadowView, Math.max(0, bgIdx), new FrameLayout.LayoutParams(1, 1));\n''',
              '''                            if (dockShadow) {\n                                View shadowView = makeDockShadow(oldBg, c2.squircle, sqOff, sqCp, dsR, dsS, dsA, dsY);\n                                shadowViewRef = new WeakReference<>(shadowView);\n                                shadowView.setId(View.generateViewId());\n                                int bgIdx = parent.indexOfChild(oldBg);\n                                parent.addView(shadowView, Math.max(0, bgIdx), new FrameLayout.LayoutParams(1, 1));\n''',
              'shadow creation')
          once(
              '''            if (dockBg != null) dockBg.post(() -> {\n                dockBg.setAlpha(1f);\n                if (shadowView != null) shadowView.setVisibility(View.VISIBLE);\n                syncAll(dockBg);\n            });\n''',
              '''            if (dockBg != null) dockBg.post(() -> {\n                dockBg.setAlpha(1f);\n                View currentShadow = shadowViewRef.get();\n                if (currentShadow != null) currentShadow.setVisibility(View.VISIBLE);\n                syncAll(dockBg);\n            });\n''',
              'workstation restore')
          once(
              '''        if (dockBg != null) dockBg.post(() -> {\n            // The workstation Dock background is rendered by its independent laptop\n            // DockContainerView. Suppress every normal-mode background layer here.\n            dockBg.setAlpha(0f);\n            if (shadowView != null) shadowView.setVisibility(View.GONE);\n        });\n''',
              '''        if (dockBg != null) dockBg.post(() -> {\n            // The workstation Dock background is rendered by its independent laptop\n            // DockContainerView. Suppress every normal-mode background layer here.\n            dockBg.setAlpha(0f);\n            View currentShadow = shadowViewRef.get();\n            if (currentShadow != null) currentShadow.setVisibility(View.GONE);\n        });\n''',
              'workstation suppress')
          once(
              '                if (shadowView == this) shadowView = null;\n',
              '                if (shadowViewRef.get() == this) shadowViewRef = new WeakReference<>(null);\n',
              'shadow detach')
          once(
              '        View shadow = shadowView, dockBg = oldBg();\n',
              '        View shadow = shadowViewRef.get(), dockBg = oldBg();\n',
              'shadow geometry')
          once(
              '''    private static void syncAll(View bg) {\n        if (bg == null || shadowView == null) return;\n        boolean anim = animating(bg);\n''',
              '''    private static void syncAll(View bg) {\n        View shadowView = shadowViewRef.get();\n        if (bg == null || shadowView == null) return;\n        boolean anim = animating(bg);\n''',
              'shadow sync')

          p.write_text(s)
          PY
          git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-confirmed-bugfix-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3
      - name: Commit verified MainHook fix
        shell: bash
        run: |
          if git diff --quiet -- src/main/java/com/hellovoid/liquiddock/MainHook.java; then
            echo 'MainHook already matches verified fix'
            exit 0
          fi
          git add src/main/java/com/hellovoid/liquiddock/MainHook.java
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix: release dock shadow view on hierarchy teardown'
          git pull --rebase origin fix/glass-controls-s-curve
          git push origin HEAD:fix/glass-controls-s-curve
      - name: Lint audit without crashing Bidi detector
        continue-on-error: true
        shell: bash
        run: |
          cp build.gradle.kts /tmp/build.gradle.kts
          trap 'mv /tmp/build.gradle.kts build.gradle.kts' EXIT
          cat >> build.gradle.kts <<'EOF'

          android {
              lint {
                  disable += "BidiSpoofing"
              }
          }
          EOF
          ./gradlew lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LiquidDock-confirmed-bugfix-lint
          path: |
            build/reports/lint-results-debug.html
            build/reports/lint-results-debug.txt
            build/reports/lint-results-debug.xml
          if-no-files-found: warn
          retention-days: 3

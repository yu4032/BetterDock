name: Confirmed bugfix verification

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/glass-controls-s-curve
      - name: Source hygiene
        run: git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-confirmed-bugfix-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3
      - name: Lint audit without crashing Bidi detector
        continue-on-error: true
        shell: bash
        run: |
          cp build.gradle.kts /tmp/build.gradle.kts
          trap 'mv /tmp/build.gradle.kts build.gradle.kts' EXIT
          cat >> build.gradle.kts <<'EOF'

          android {
              lint {
                  disable += "BidiSpoofing"
              }
          }
          EOF
          ./gradlew lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LiquidDock-confirmed-bugfix-lint
          path: |
            build/reports/lint-results-debug.html
            build/reports/lint-results-debug.txt
            build/reports/lint-results-debug.xml
          if-no-files-found: warn
          retention-days: 3

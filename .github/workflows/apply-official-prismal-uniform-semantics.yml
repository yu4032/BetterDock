name: Apply official Prismal uniform semantics

on:
  push:
    branches:
      - refactor/prismal-official-model

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/prismal-official-model
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Apply official binary uniform semantics
        run: |
          set -euxo pipefail
          python tools/apply_prismal_official_uniform_semantics.py
          git diff --check
          grep -n -A8 -B3 'glassUniformLocation' prismal/src/main/java/com/hellovoid/prismal/PrismalRenderer.java
      - name: Clean staging and restore standard CI
        run: |
          set -euxo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/api101-build.yml > .github/workflows/api101-build.yml
          rm -f tools/apply_prismal_official_uniform_semantics.py
          rm -f tools/apply_prismal_inactive_uniform_fix.py
          rm -f tools/apply_prismal_runtime_resource_fix.py
          rm -f .github/workflows/decompile-official-prismal.yml
          rm -f .github/workflows/prismal-inactive-uniform-fix.yml
          rm -f .github/workflows/apply-official-prismal-uniform-semantics.yml
          git diff --check
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Commit verified production change
        run: |
          set -euxo pipefail
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix: match official Prismal uniform upload semantics'
          git push origin HEAD:refactor/prismal-official-model

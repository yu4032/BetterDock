name: Temporary stable theme owner patch

on:
  push:
    branches:
      - fix/miuix307-drag-freeform-followup

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/miuix307-drag-freeform-followup
          fetch-depth: 0
      - name: Apply stable owner patch
        shell: bash
        run: |
          set -euo pipefail
          subject="$(git log -1 --pretty=%s)"
          if [ "$subject" != "chore: run stable theme owner patch" ]; then
            echo "No patch for commit: $subject"
            exit 0
          fi
          python3 tools/tmp_theme_owner_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/hellovoid/liquiddock/Miuix307MaterialPipeline.java
          git diff --cached --check
          git commit -m "fix: recover MiuiX glass across HotSeats theme rebuilds"
          git push origin HEAD:fix/miuix307-drag-freeform-followup

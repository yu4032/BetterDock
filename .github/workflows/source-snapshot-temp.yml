name: Temporary source snapshot

on:
  push:
    branches:
      - feat/folder-press-glow

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack source
        run: |
          tar -czf /tmp/liquiddock-source.tar.gz \
            --exclude=.git \
            --exclude=build \
            --exclude=prismal/build \
            .
      - uses: actions/upload-artifact@v4
        with:
          name: liquiddock-source-snapshot
          path: /tmp/liquiddock-source.tar.gz
          retention-days: 1

name: Temporary source snapshot

on:
  push:
    branches:
      - feat/folder-press-glow

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack source snapshot
        run: tar -czf liquiddock-source-snapshot.tar.gz --exclude=.git .
      - uses: actions/upload-artifact@v4
        with:
          name: liquiddock-source-snapshot
          path: liquiddock-source-snapshot.tar.gz
          retention-days: 1
